function compressImage(file, maxW=640, quality=0.72){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,maxW/img.width); const w=Math.round(img.width*s),h=Math.round(img.height*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',quality)); };
      img.onerror=rej; img.src=e.target.result; }; r.onerror=rej; r.readAsDataURL(file);
  });
}

const api=async(path,opts={})=>{

  if(!r.ok||!j||j.ok===false){ const err=new Error((j&&j.error)||('HTTP '+r.status)); err.body=j; err.status=r.status; throw err; }
  return j;
};

/* توحيد رقم الجوال السعودي: 05XXXXXXXX / 5XXXXXXXX -> +9665XXXXXXXX */
function normalizePhone(raw){
  let d=(raw||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('00966')) d=d.slice(2);
  if(d.startsWith('0')&&d.length===10) d='966'+d.slice(1);
  else if(d.startsWith('5')&&d.length===9) d='966'+d;
  return d;
}
function isValidSaPhone(raw){ return /^9665\d{8}$/.test(normalizePhone(raw)); }
function formatPhoneDisplay(raw){ const d=normalizePhone(raw); return d?('+'+d):raw; }
function daysLeftInMonth(){ const now=new Date(); const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(); return lastDay-now.getDate(); }
/* حركة "طيران" من زر الإضافة للسلة لحد أيقونة السلة بالهيدر فوق — DOM مباشر (بدون React state)، حركة هادية وخفيفة مو سريعة.
   لو فيه صورة منتج فعلية (imgUrl) تطير هي نفسها بدل رمز السوشي التعبيري */
function flyToCart(startEl,imgUrl){
  try{
    const cartEl=document.getElementById('cart-header-icon')||document.getElementById('cart-fab');
    if(!startEl||!cartEl) return;
    const s=startEl.getBoundingClientRect(); const c=cartEl.getBoundingClientRect();
    const startX=s.left+s.width/2, startY=s.top+s.height/2;
    const endX=c.left+c.width/2, endY=c.top+c.height/2;
    const el=document.createElement(imgUrl?'img':'div');
    if(imgUrl){ el.src=imgUrl; el.style.cssText='width:34px;height:34px;border-radius:9999px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.25);'; }
    else{ el.textContent='🍣'; el.style.cssText='font-size:26px;line-height:1;'; }
    const endRot=(Math.random()>.5?1:-1)*30;
    el.style.cssText+=`position:fixed;left:${startX}px;top:${startY}px;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1) rotate(0deg);transition:transform 1.45s cubic-bezier(.22,.61,.36,1), opacity 1.45s ease-in;will-change:transform,opacity;`;
    document.body.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const dx=endX-startX, dy=endY-startY;
      el.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.45) rotate(${endRot}deg)`;
      el.style.opacity='0.2';
    }));
    setTimeout(()=>el.remove(),1550);
  }catch(e){}
}

const discountedPrice=(p,settings)=>{
  if(p.salePrice&&p.salePrice>0&&p.salePrice<p.price) return Math.round(p.salePrice*100)/100;
  const d=settings&&settings.discount;
  if(d&&d.enabled){
    const matches = d.scope==='all' || (d.scope==='category'&&p.cat===d.categoryId) || (d.scope==='products'&&(d.productIds||[]).includes(p.id));
    if(matches){
      const pct=Math.max(0,Math.min(90,Number(d.percent)||0));
      if(pct>0) return Math.round(p.price*(1-pct/100)*100)/100;
    }
  }
  return p.price;
};

/* open-now from "hours" text like "4 PM – 12 AM" — best-effort */
function isOpenNow(hoursEn){ try{
  const s=(hoursEn||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); const m=s.match(/(\d{1,2})\s*(am|pm|ص|م)?.*?(\d{1,2})\s*(am|pm|ص|م)?/i);
  if(!m) return null; const to24=(h,ap)=>{ h=+h; ap=(ap||'').toLowerCase(); if(ap==='pm'||ap==='م'){ if(h<12)h+=12; } if((ap==='am'||ap==='ص')&&h===12)h=0; return h; };
  let a=to24(m[1],m[2]), b=to24(m[3],m[4]); const now=new Date().getHours()+new Date().getMinutes()/60;
  if(b<=a) b+=24; let n=now; if(n<a) n+=24; return (n>=a&&n<=b);
}catch(e){ return null; } }

/* ===== APP ===== */
function App(){
  const [lang,setLang]=useState(store.get('ls_lang','ar'));
  const [settings,setSettings]=useState(()=>{ const s={...DEFAULT_SETTINGS,...store.get('ls_settings',{})}; s.logo=fixImg(s.logo); s.hero=fixImg(s.hero); return s; });
  const [cats,setCats]=useState(()=>store.get('ls_cats',DEFAULT_CATEGORIES));
  const [products,setProducts]=useState(()=>store.get('ls_products',DEFAULT_PRODUCTS).map(p=>({...p,img:fixImg(p.img)})));
  const [isAdmin,setIsAdmin]=useState(()=>store.get('ls_session',false));
  const [view,setView]=useState('site');
  const [cart,setCart]=useState(()=>store.get('ls_cart',[])); const [cartOpen,setCartOpen]=useState(false); const [loginOpen,setLoginOpen]=useState(false);
  const [modalP,setModalP]=useState(null); const [toast,setToast]=useState(null);

  const ar=lang==='ar'; const t=k=>(T[k]?T[k][lang]:k); const L=o=>ar?(o.ar||o.en):(o.en||o.ar);
  const ready=useRef(false); const toastTimer=useRef();
  const notify=msg=>{ setToast({msg,id:uid()}); clearTimeout(toastTimer.current); toastTimer.current=setTimeout(()=>setToast(null),2200); };

  /* DB: pull shared data on load (all devices see admin's latest) */
  useEffect(()=>{ let live=true; (async()=>{
    try{
      const {settings:s,cats:c,products:p}=await apiGet('get_state.php');
      if(live){
        if(s&&Object.keys(s).length) setSettings(prev=>{ const n={...prev,...s}; n.logo=fixImg(n.logo); n.hero=fixImg(n.hero); return n; });
        if(Array.isArray(c)&&c.length) setCats(c);
        if(Array.isArray(p)&&p.length) setProducts(p.map(x=>({...x,img:fixImg(x.img)})));
      }
    }catch(e){ console.warn('load state failed, using local cache',e.message); }
    if(live) ready.current=true;
  })(); return ()=>{ live=false; }; },[]);

  /* DB: push when the admin edits (debounced); customers never write */
  const [syncStatus,setSyncStatus]=useState('idle'); // idle | syncing | synced | error
  const [syncError,setSyncError]=useState('');
  useEffect(()=>{ if(!ready.current||!isAdmin) return;
    const id=setTimeout(()=>{
      setSyncStatus('syncing');
      apiPost('save_state.php',packState(settings,cats,products))
        .then(()=>{ setSyncStatus('synced'); setSyncError(''); })
        .catch(e=>{ setSyncStatus('error'); setSyncError(e.message); console.warn('sync',e.message); });
    }, 700);
    return ()=>clearTimeout(id);
  },[settings,cats,products,isAdmin]);

  useEffect(()=>{ document.documentElement.lang=lang; document.documentElement.dir=ar?'rtl':'ltr'; store.set('ls_lang',lang); },[lang]);
  useEffect(()=>store.set('ls_settings',settings),[settings]);
  useEffect(()=>store.set('ls_cats',cats),[cats]);
  /* نحفظ نسخة محلية بدون الصور (base64 الصور وحدها اللي تعبّي مساحة المتصفح المحدودة وتسبب فشل الحفظ) —
     النسخة المحلية أصلاً احتياط لو تعطّل الاتصال بالسيرفر، فمو مشكلة لو صارت بدون صور لحظياً */
  useEffect(()=>store.set('ls_products',products.map(p=>({...p,img:undefined}))),[products]);
  useEffect(()=>store.set('ls_session',isAdmin),[isAdmin]);
  useEffect(()=>store.set('ls_cart',cart),[cart]);
  useEffect(()=>{ document.body.classList.toggle('noscroll',cartOpen||loginOpen||!!modalP); },[cartOpen,loginOpen,modalP]);
  useEffect(()=>{ const f=document.getElementById('favicon'); if(f&&(settings.logo||IMG.logo)) f.href=settings.logo||IMG.logo; },[settings.logo]);

  const cur=ar?settings.currencyAr:settings.currencyEn;
  const cartKey=(p)=> p.id+(p.selectedExtras&&p.selectedExtras.length?'::'+p.selectedExtras.map(e=>`${e.ar}x${e.qty}`).join(','):'');
  const addToCart=(p,q=1,note='')=>{ const k=cartKey(p); setCart(c=>{ const f=c.find(x=>cartKey(x)===k); return f?c.map(x=>cartKey(x)===k?{...x,q:x.q+q,note:note||x.note}:x):[...c,{...p,q,note}]; }); notify(L({ar:p.ar,en:p.en})+' · '+t('itemAdded')); };
  const setQty=(key,q)=>setCart(c=>q<=0?c.filter(x=>cartKey(x)!==key):c.map(x=>cartKey(x)===key?{...x,q}:x));
  const clearCart=()=>setCart([]);
  const cartTotal=cart.reduce((s,x)=>s+x.price*x.q,0); const cartCount=cart.reduce((s,x)=>s+x.q,0);

  if(view==='admin'&&isAdmin) return <Admin {...{lang,setLang,t,L,ar,settings,setSettings,cats,setCats,products,setProducts,cur,syncStatus,syncError,exit:()=>setView('site'),logout:()=>{apiPost('admin_logout.php').catch(()=>{});setIsAdmin(false);setView('site');}}}/>;

  return (
    <div className="font-body min-h-screen" style={{background:'var(--bg)'}}>
      {settings.storeOpen===false && <ClosedBanner ar={ar}/>}
      <PromoBar {...{ar,settings}}/>
      <Header {...{t,ar,lang,setLang,settings,cartCount,openCart:()=>setCartOpen(true),openLogin:()=>isAdmin?setView('admin'):setLoginOpen(true)}}/>
      <Hero {...{t,ar,settings}}/>
      <Strip {...{t,ar}}/>
      <Featured {...{t,ar,L,settings,products,addToCart,openModal:setModalP,cur}}/>
      <Menu {...{t,ar,L,settings,cats,products,addToCart,openModal:setModalP,cur}}/>
      <HowToOrder {...{t,ar}}/>
      <Delivery {...{t,ar,L,settings}}/>
      <SalesPoints {...{t,ar,L,settings}}/>
      <Gallery {...{t,ar,products}}/>
      <Location {...{t,ar,L,settings}}/>
      <About {...{t,ar,settings}}/>
      <Footer {...{t,ar,settings}}/>

      {cartCount>0 &&
        <button id="cart-fab" onClick={()=>setCartOpen(true)} className="fixed bottom-5 z-40 flex items-center gap-2 px-5 py-3 rounded-2xl text-white shadow-soft font-head animate-[rise_.4s]" style={{[ar?'left':'right']:'1.25rem',background:'var(--red)'}}>
          <Ic.cart width="20" height="20"/><span>{cartCount}</span><span className="opacity-90">{cartTotal} {cur}</span>
        </button>}
      <ScrollTop ar={ar}/>

      {modalP && <ProductModal {...{t,ar,L,p:modalP,cur,settings,addToCart,close:()=>setModalP(null)}}/>}
      {cartOpen && <CartDrawer {...{t,ar,L,settings,cart,setQty,cartTotal,cur,clearCart,products,addToCart,close:()=>setCartOpen(false)}}/>}
      {loginOpen && <Login {...{t,ar,close:()=>setLoginOpen(false),success:()=>{setIsAdmin(true);setLoginOpen(false);setView('admin');}}}/>}
      <Toasts toast={toast}/>
    </div>
  );
}

/* ===== MENU ===== */
function Menu({t,ar,L,settings,cats,products,addToCart,openModal,cur}){
  const [active,setActive]=useState('all'); const [q,setQ]=useState('');
  const ql=q.trim().toLowerCase();
  // بوضع "الكل" نرتّب المنتجات حسب ترتيب الأقسام نفسه (Array.sort مستقر، فيحافظ على ترتيب المنتجات داخل كل قسم)
  const catOrder=useMemo(()=>{ const m={}; cats.forEach((c,i)=>m[c.id]=i); return m; },[cats]);
  let list=active==='all' ? [...products].sort((a,b)=>(catOrder[a.cat]??999)-(catOrder[b.cat]??999)) : products.filter(p=>p.cat===active);
  list=list.filter(p=>!p.isAddon);
  const shown=ql?list.filter(p=>((p.ar||'')+(p.en||'')+(p.dAr||'')+(p.dEn||'')).toLowerCase().includes(ql)):list;
  return (
    <section id="menu" className="max-w-6xl mx-auto px-4 sm:px-6 py-16 sm:py-20">
      <SectionTitle ar={ar} kicker={ar?'メニュー · قائمتنا':'メニュー · Our Menu'} title={t('menu')}/>
      <div className="max-w-md mx-auto mb-6 relative">
        <span className="absolute top-1/2 -translate-y-1/2 opacity-50" style={{[ar?'right':'left']:'14px'}}><Ic.search width="18" height="18"/></span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder={t('search')} className="w-full py-3 rounded-2xl border-2 hairline bg-white outline-none focus:border-red transition font-body" style={{[ar?'paddingRight':'paddingLeft']:'44px',[ar?'paddingLeft':'paddingRight']:'16px'}}/>
      </div>
      <div className="flex flex-wrap gap-2 justify-center mb-10">
        <Chip active={active==='all'} onClick={()=>setActive('all')}>{t('all')}</Chip>
        {cats.map(c=><Chip key={c.id} active={active===c.id} onClick={()=>setActive(c.id)}>{L(c)}</Chip>)}
      </div>
      {shown.length===0
        ? <p className="text-center py-10" style={{color:'var(--muted)'}}>{t('noProducts')}</p>
        : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">{shown.map((p,i)=><ProductCard key={p.id} {...{p,ar,L,t,settings,addToCart,openModal,cur,i}}/>)}</div>}
    </section>
  );
}
function ProductCard({p,ar,L,t,settings,addToCart,openModal,cur,i}){

  return (
    <div className={`group bg-white rounded-3xl overflow-hidden shadow-card hover:shadow-soft hover:-translate-y-1 active:translate-y-0 transition-all duration-300 reveal border hairline ${outOfStock?'opacity-70':''}`} style={{animationDelay:`${.04*i}s`}}>
      <div className="aspect-[4/3] overflow-hidden relative bg-ink cursor-pointer" onClick={()=>openModal&&openModal(p)}>
        {p.img ? <img src={p.img} alt={L(p)} loading="lazy" decoding="async" className={`product-img w-full h-full object-cover ${outOfStock?'grayscale':''}`}/> : <div className="w-full h-full grid place-items-center"><Mascot size={56}/></div>}
        {outOfStock
          ? <div className="absolute top-3 font-head text-white text-sm px-3 py-1 rounded-full shadow-card" style={{[ar?'right':'left']:'12px',background:'#6b6058'}}>{ar?'نفذت الكمية':'Sold out'}</div>
          : <div className="absolute top-3 font-head text-white text-sm px-3 py-1 rounded-full shadow-card flex items-center gap-1.5" style={{[ar?'right':'left']:'12px',background:'var(--red)'}}>{onSale&&<span className="line-through opacity-70 text-xs">{p.price}</span>}<span>{finalPrice} {cur}</span></div>}
        {onSale&&!outOfStock&&<div className="absolute top-3 font-head text-[11px] px-2.5 py-1 rounded-full shadow-card text-white" style={{[ar?'left':'right']:'12px',background:'#C0392B'}}>🏷️ {ar?'خصم':'Sale'}</div>}
        {p.feat&&!outOfStock&&!onSale&&<div className="absolute top-3 font-head text-[11px] px-2.5 py-1 rounded-full shadow-card flex items-center gap-1" style={{[ar?'left':'right']:'12px',background:'#fff',color:'var(--red)'}}><Ic.star width="11" height="11"/>{t('featured')}</div>}
        {outOfStock&&<div className="absolute inset-0 bg-black/10"/>}
        <div className="absolute inset-0 bg-black/0 group-hover:bg-black/15 transition grid place-items-center opacity-0 group-hover:opacity-100"><span className="bg-white/95 text-ink font-head text-sm px-4 py-2 rounded-full flex items-center gap-1.5"><Ic.eye width="15" height="15"/>{t('viewDetails')}</span></div>
      </div>
      <div className="p-5">

        {outOfStock

  const [custStatus,setCustStatus]=useState(null); // {found,name,walletBalance,activeCashback,subscription,pendingOrder}

    const found=(settings.coupons||[]).find(x=>(x.code||'').toUpperCase()===c && x.active!==false);
    return found||null;
  })();
  const couponAlreadyUsed=!!(appliedCoupon && appliedCoupon.used);
  const couponValid=!!(appliedCoupon && !couponAlreadyUsed);
  const addonProducts=(products||[]).filter(p=>p.isAddon && p.on!==false && !cart.some(c=>c.id===p.id));
  const addonUI=addonProducts.length>0 && (
    <div className="rounded-2xl border hairline p-3 bg-white shadow-card">

            <div className="text-[11px] font-semibold truncate w-full" style={{color:'var(--ink)'}}>{L(p)}</div>

          </div>)}

  );
  const [scheduleMode,setScheduleMode]=useState(false);
  const [schedDate,setSchedDate]=useState(''); const [schedTime,setSchedTime]=useState('');
  const scheduledFor = schedDate&&schedTime ? schedDate+'T'+schedTime : '';
  const setScheduledFor=v=>{ const [d,tm]=(v||'').split('T'); setSchedDate(d||''); setSchedTime(tm||''); };
  const now5=new Date(Date.now()+5*60000); const pad2=n=>String(n).padStart(2,'0');
  const minDateValue=`${now5.getFullYear()}-${pad2(now5.getMonth()+1)}-${pad2(now5.getDate())}`;
  const minTimeValue= schedDate===minDateValue ? `${pad2(now5.getHours())}:${pad2(now5.getMinutes())}` : undefined;

/* نغمة تنبيه بسيطة نولّدها برمجياً (بدون ملف صوتي خارجي) */
/* نغمة جرس نولّدها برمجياً (بدون ملف صوتي خارجي). نحتفظ بسياق صوت واحد نفتحه أول ضغطة
   حقيقية من المستخدم بلوحة التحكم — المتصفحات تمنع تشغيل صوت تلقائي (من setInterval مثلاً)
   إلا لو كان نفس الـ AudioContext انفتح أول مرة بإيماءة مستخدم فعلية. */
let sharedAudioCtx=null;
const unlockAudio=()=>{
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx) return;
    if(!sharedAudioCtx) sharedAudioCtx=new AudioCtx();
    if(sharedAudioCtx.state==='suspended') sharedAudioCtx.resume().catch(()=>{});
  }catch(e){}
};
const playNotifySound=()=>{
  try{
    unlockAudio();
    const ctx=sharedAudioCtx;
    if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const now=ctx.currentTime+0.02;
    // نغمة أصلية: تتابع سريع صاعد بموجة مثلثية حيوية + نغمة ختامية أعلى وأطول تلفت الانتباه
    const notes=[[622.25,now,0.085],[622.25,now+0.10,0.085],[880,now+0.22,0.30]];
    notes.forEach(([freq,start,dur],i)=>{
      const osc=ctx.createOscillator(); const gain=ctx.createGain();
      osc.type='triangle'; osc.frequency.value=freq;
      const peak=i===2?0.6:0.5;
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.exponentialRampToValueAtTime(peak,start+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001,start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+dur+0.03);
      const osc2=ctx.createOscillator(); const gain2=ctx.createGain();
      osc2.type='sine'; osc2.frequency.value=freq*2;
      gain2.gain.setValueAtTime(0.0001,start);
      gain2.gain.exponentialRampToValueAtTime(peak*0.28,start+0.01);
      gain2.gain.exponentialRampToValueAtTime(0.0001,start+dur*0.6);
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.start(start); osc2.stop(start+dur*0.6+0.03);
    });
  }catch(e){ console.warn('notify sound failed',e); }
};

/* ===== ADMIN ===== */
function Admin({lang,setLang,t,L,ar,settings,setSettings,cats,setCats,products,setProducts,cur,syncStatus,syncError,exit,logout}){
  const [tab,setTab]=useState('orders');
  const [ordersAlert,setOrdersAlert]=useState(0);
  const [refreshTick,setRefreshTick]=useState(0);
  const [customersAlert,setCustomersAlert]=useState(0);
  const [cartsAlert,setCartsAlert]=useState(0);
  const [soundOn,setSoundOn]=useState(()=>localStorage.getItem('adminSoundAlerts')!=='0');
  const soundOnRef=useRef(soundOn);
  useEffect(()=>{ soundOnRef.current=soundOn; },[soundOn]);
  const prevOrdersCount=useRef(null);
  const threshold0=settings.frequentCustomerThreshold||5;
  const toggleSound=()=>{
    if(alerting){ stopAlertRepeat(); return; } // ضغطة أثناء الرنين = "خلاص سمعت" — توقفه بدون ما تلمس تفضيل التشغيل العام
    setSoundOn(v=>{ const nv=!v; localStorage.setItem('adminSoundAlerts',nv?'1':'0'); if(nv) playNotifySound(); return nv; });
  };
  /* تنبيه متكرر (زي تطبيقات التوصيل المعروفة) — يفضل يرن كل ٢.٢ ثانية لين الأدمن يفتح تبويب
     الطلبات (يعتبر هذا "استلمت التنبيه") أو يوقفه يدوي، وبحد أقصى ~40 مرة احتياط لو انسحب */
  const alertIntervalRef=useRef(null); const alertCountRef=useRef(0);
  const [alerting,setAlerting]=useState(false);
  const stopAlertRepeat=()=>{ if(alertIntervalRef.current){ clearInterval(alertIntervalRef.current); alertIntervalRef.current=null; } alertCountRef.current=0; setAlerting(false); };
  const startAlertRepeat=()=>{
    stopAlertRepeat();
    setAlerting(true);
    playNotifySound(); alertCountRef.current=1;
    alertIntervalRef.current=setInterval(()=>{
      alertCountRef.current++;
      if(alertCountRef.current>40){ stopAlertRepeat(); return; }
      playNotifySound();
    },2200);
  };
  useEffect(()=>()=>stopAlertRepeat(),[]);
  useEffect(()=>{ if(tab==='orders') stopAlertRepeat(); },[tab]);
  const refreshAlerts=()=>{
    Promise.all([
      apiGet('admin_orders.php?status=pending').catch(()=>({orders:[]})),
      apiGet('admin_cashback.php').catch(()=>({cashback:[]})),
      apiGet('admin_customers.php').catch(()=>({customers:[],threshold:threshold0})),
      apiGet('admin_carts.php').catch(()=>({carts:[]})),
    ]).then(([o,cb,cu,ca])=>{
      const newOrdersCount=(o.orders||[]).length;
      if(soundOnRef.current && prevOrdersCount.current!==null && newOrdersCount>prevOrdersCount.current) startAlertRepeat();
      prevOrdersCount.current=newOrdersCount;
      setOrdersAlert(newOrdersCount);
      const expSoon=(cb.cashback||[]).filter(x=>x.expiringSoon).length;
      const th=cu.threshold||threshold0;
      const nearDeadline=daysLeftInMonth()<=5 ? (cu.customers||[]).filter(c=>!c.isFrequent&&c.order_count===th-1).length : 0;
      setCustomersAlert(expSoon+nearDeadline);
      setCartsAlert((ca.carts||[]).filter(x=>x.ageMinutes>=20).length);
      setRefreshTick(v=>v+1);
    });
  };
  useEffect(()=>{ refreshAlerts(); const id=setInterval(refreshAlerts,20000); return ()=>clearInterval(id); },[]);
  /* أول ضغطة حقيقية من المستخدم بلوحة التحكم تفتح مسار الصوت (متطلب من المتصفحات) عشان
     تنبيهات الطلبات اللاحقة (اللي تجي من setInterval بدون تفاعل مباشر) تقدر تصدر صوت فعلياً */
  useEffect(()=>{ const h=()=>{ unlockAudio(); }; document.addEventListener('pointerdown',h,{once:true}); return ()=>document.removeEventListener('pointerdown',h); },[]);
  /* أهم سبب واقعي لـ"الصوت يشتغل مرة وحدة بس": الجوال يجمّد المؤقّتات (setInterval) والصوت لما
     تسكّر التبويب أو تطلع لتطبيق ثاني (واتساب مثلاً). أول ما ترجع للصفحة، نعيد فتح مسار الصوت
     ونسوي فحص فوري بدل ما ننتظر الدورة القادمة (ممكن تكون فاتت وأنت مو موجود). */
  useEffect(()=>{
    const onVis=()=>{ if(document.visibilityState==='visible'){ unlockAudio(); refreshAlerts(); } };
    document.addEventListener('visibilitychange',onVis);
    return ()=>document.removeEventListener('visibilitychange',onVis);
  },[]);
  const tabs=[
    ['orders',Ic.bag,ordersAlert>0?ordersAlert:null],
    ['carts',Ic.cart,cartsAlert>0?cartsAlert:null],
    ['customers',Ic.star,customersAlert>0?customersAlert:null],
    ['drivers',Ic.truck,null],
    ['reports',Ic.chart,null],
    ['broadcast',Ic.wa,null],
    ['products',Ic.bag,null],
    ['categories',Ic.gear,null],
    ['settings',Ic.gear,null],
    ['account',Ic.lock,null],
  ];
  const T2={orders:{ar:'الطلبات',en:'Orders'},carts:{ar:'سلات متروكة',en:'Abandoned carts'},customers:{ar:'العملاء',en:'Customers'},drivers:{ar:'🛵 المناديب',en:'🛵 Drivers'},reports:{ar:'التقارير',en:'Reports'},broadcast:{ar:'رسالة جماعية',en:'Broadcast'}};
  const tabLabel=k=>T2[k]?T2[k][lang]:t(k);
  return (
    <div className="font-body min-h-screen" style={{background:'var(--bg)'}}>
      <header className="glass sticky top-0 z-20 border-b hairline">
        <div className="max-w-6xl mx-auto px-3 sm:px-6 py-2.5 sm:h-16 flex flex-wrap items-center justify-between gap-2 sm:gap-3">
          <div className="flex items-center gap-2 sm:gap-3"><Mascot size={32}/><div><div className="font-head text-base sm:text-lg leading-tight" style={{color:'var(--red)'}}>{t('dashboard')}</div><div className="text-[10px] sm:text-[11px]" style={{color:'var(--muted)'}}>{ar?settings.brandAr:settings.brandEn}</div></div></div>
          <div className="flex items-center gap-1.5 sm:gap-2">
            <button onClick={toggleSound} title={alerting?(ar?'🔴 طلب جديد يرن — اضغط للإيقاف':'🔴 New order ringing — tap to stop'):soundOn?(ar?'التنبيه الصوتي مفعّل — اضغط للإيقاف':'Sound alerts on — tap to mute'):(ar?'التنبيه الصوتي متوقف — اضغط للتفعيل':'Sound alerts off — tap to enable')} className={`w-8 h-8 sm:w-9 sm:h-9 grid place-items-center rounded-xl border-2 shrink-0 relative ${alerting?'animate-pulse':''}`} style={soundOn?{color:'var(--red)',borderColor:alerting?'var(--red)':'var(--line)'}:{color:'var(--muted)',borderColor:'var(--line)'}}>{soundOn?<Ic.bell width="16" height="16"/>:<Ic.bellOff width="16" height="16"/>}{alerting&&<span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full" style={{background:'#E11B2E'}}/>}</button>
            <button onClick={()=>setLang(lang==='ar'?'en':'ar')} className="px-2.5 sm:px-3 h-8 sm:h-9 rounded-xl border-2 hairline text-xs sm:text-sm font-semibold">{lang==='ar'?'EN':'ع'}</button>
            <button onClick={exit} className="px-2.5 sm:px-4 h-8 sm:h-9 rounded-xl border-2 hairline text-xs sm:text-sm font-semibold hover:bg-paper-deep whitespace-nowrap">{t('backSite')}</button>
            <button onClick={logout} className="px-2.5 sm:px-4 h-8 sm:h-9 rounded-xl text-xs sm:text-sm text-white font-semibold whitespace-nowrap" style={{background:'var(--red)'}}>{t('logout')}</button>
          </div>
        </div>
      </header>
      {syncStatus==='error'&&
        <div className="px-3 sm:px-6 py-2.5 text-xs sm:text-sm font-semibold text-white flex items-center justify-center gap-2 text-center" style={{background:'#C0392B'}}>
          ⚠️ {ar?`آخر تعديل ما وصل لقاعدة البيانات فعلياً (${syncError||'خطأ اتصال'}). التغييرات اللي تشوفها الآن محفوظة بمتصفحك بس، مو على السيرفر — أعد المحاولة أو تأكد من الإنترنت.`:`Your last change did NOT reach the database (${syncError||'connection error'}). What you see now is only saved in your browser, not on the server — try again or check your connection.`}
        </div>}
      {syncStatus==='syncing'&&
        <div className="px-3 sm:px-6 py-1.5 text-xs font-semibold text-white text-center" style={{background:'#8A7766'}}>
          {ar?'⏳ جاري الحفظ على السيرفر…':'⏳ Saving to server…'}
        </div>}
      <div className="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
        <div className="flex gap-2 mb-6 overflow-x-auto pb-1 -mx-3 px-3 sm:mx-0 sm:px-0">
          {tabs.map(([k,Icon,badge])=><button key={k} onClick={()=>setTab(k)} className={`relative px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-xl font-head text-sm sm:text-base whitespace-nowrap flex items-center gap-1.5 sm:gap-2 transition border-2 shrink-0 ${tab===k?'text-white':'bg-white'}`} style={tab===k?{background:'var(--red)',borderColor:'var(--red)'}:{color:'var(--ink)',borderColor:'var(--line)'}}><Icon width="15" height="15"/>{tabLabel(k)}{!!badge&&<span className="ms-1 min-w-[18px] h-[18px] px-1 grid place-items-center text-[10px] rounded-full text-white" style={{background:'#E11B2E'}}>{badge}</span>}</button>)}
        </div>
        {tab==='orders'&&<AdminOrders {...{ar,lang,cur,settings,onChanged:refreshAlerts,refreshTick,onOrderHandled:stopAlertRepeat}}/>}
        {tab==='carts'&&<AdminCarts {...{ar,lang,cur,onChanged:refreshAlerts}}/>}
        {tab==='customers'&&<AdminCustomers {...{ar,lang,cur,settings,onChanged:refreshAlerts}}/>}
        {tab==='drivers'&&<AdminDrivers {...{ar,lang}}/>}
        {tab==='reports'&&<AdminReports {...{ar,lang,cur}}/>}
        {tab==='broadcast'&&<AdminBroadcast {...{ar,settings}}/>}
        {tab==='products'&&<AdminProducts {...{t,ar,L,cats,products,setProducts}}/>}
        {tab==='categories'&&<AdminCats {...{t,ar,L,cats,setCats,products,setProducts}}/>}
        {tab==='settings'&&<AdminSettings {...{t,ar,L,settings,setSettings,cats,products}}/>}
        {tab==='account'&&<AdminAccount {...{t}}/>}
      </div>
    </div>
  );
}
/* ===== ADMIN: الطلبات المعلقة (بانتظار الموافقة) ===== */
/* ===== ADMIN REPORTS ===== */
function AdminReports({ar,lang,cur}){
  const todayStr=()=>{ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
  const daysAgoStr=n=>{ const d=new Date(Date.now()-n*86400000); const p=x=>String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
  const [preset,setPreset]=useState('week');
  const [from,setFrom]=useState(daysAgoStr(6)); const [to,setTo]=useState(todayStr());
  const [data,setData]=useState(null); const [loading,setLoading]=useState(true);
  const [typeFilter,setTypeFilter]=useState('all'); // 'all' | 'delivery' | 'pickup'

  const applyPreset=(p)=>{
    setPreset(p);
    if(p==='today'){ setFrom(todayStr()); setTo(todayStr()); }
    else if(p==='week'){ setFrom(daysAgoStr(6)); setTo(todayStr()); }
    else if(p==='month'){ const d=new Date(); setFrom(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`); setTo(todayStr()); }
  };
  const load=()=>{ setLoading(true); setTypeFilter('all'); apiGet(`admin_sales_report.php?from=${from}&to=${to}`).then(setData).catch(()=>setData(null)).finally(()=>setLoading(false)); };
  useEffect(load,[from,to]);

  const maxDaily=data&&data.daily.length ? Math.max(...data.daily.map(d=>d.revenue),1) : 1;
  const fmtDay=(dstr)=>new Date(dstr+'T00:00:00').toLocaleDateString(ar?'ar-SA':'en-US',{weekday:'short',day:'numeric'});
  const maxProdRev=data&&data.products.length ? Math.max(...data.products.map(p=>p.revenue),1) : 1;

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-center gap-2">
        {[['today',ar?'اليوم':'Today'],['week',ar?'هالأسبوع':'This week'],['month',ar?'هالشهر':'This month']].map(([k,label])=>
          <button key={k} onClick={()=>applyPreset(k)} className="px-4 py-2 rounded-xl text-sm font-head border-2" style={preset===k?{background:'var(--red)',borderColor:'var(--red)',color:'#fff'}:{color:'var(--ink)',borderColor:'var(--line)'}}>{label}</button>)}
        <div className="flex items-center gap-1.5 ms-auto">
          <input type="date" value={from} onChange={e=>{setFrom(e.target.value);setPreset('');}} className="px-2.5 py-1.5 rounded-lg border-2 hairline text-xs" style={{colorScheme:'light',color:'var(--ink)'}} dir="ltr"/>
          <span className="text-xs" style={{color:'var(--muted)'}}>{ar?'إلى':'to'}</span>
          <input type="date" value={to} onChange={e=>{setTo(e.target.value);setPreset('');}} className="px-2.5 py-1.5 rounded-lg border-2 hairline text-xs" style={{colorScheme:'light',color:'var(--ink)'}} dir="ltr"/>
        </div>
      </div>

      {loading&&<p style={{color:'var(--muted)'}}>{ar?'جاري التحميل…':'Loading…'}</p>}

      {!loading&&data&&<>
        <div className="grid grid-cols-3 gap-3">
          <div className="bg-white rounded-2xl p-4 border hairline text-center">
            <div className="font-head text-2xl" style={{color:'var(--red)'}}>{data.summary.revenue}</div>
            <div className="text-xs mt-1" style={{color:'var(--muted)'}}>{ar?`إجمالي المبيعات (${cur})`:`Total sales (${cur})`}</div>
          </div>
          <div className="bg-white rounded-2xl p-4 border hairline text-center">
            <div className="font-head text-2xl" style={{color:'var(--ink)'}}>{data.summary.orderCount}</div>
            <div className="text-xs mt-1" style={{color:'var(--muted)'}}>{ar?'عدد الطلبات':'Orders'}</div>
          </div>
          <div className="bg-white rounded-2xl p-4 border hairline text-center">
            <div className="font-head text-2xl" style={{color:'var(--ink)'}}>{data.summary.avgOrder}</div>
            <div className="text-xs mt-1" style={{color:'var(--muted)'}}>{ar?'متوسط الطلب':'Avg order'}</div>
          </div>
        </div>

        <div className="bg-white rounded-2xl p-5 border hairline">
          <h3 className="font-head mb-4" style={{color:'var(--ink)'}}>{ar?'الإيرادات اليومية':'Daily revenue'}</h3>
          {data.daily.length===0 ? <p className="text-sm text-center py-6" style={{color:'var(--muted)'}}>{ar?'لا توجد مبيعات بهالفترة':'No sales in this period'}</p> : (
            <div className="flex items-end gap-1.5 sm:gap-2" style={{height:'140px'}}>
              {data.daily.map((d,i)=>
                <div key={i} className="flex-1 flex flex-col items-center justify-end h-full gap-1" title={`${d.date}: ${d.revenue} ${cur}`}>
                  <div className="w-full rounded-t-md transition-all" style={{height:`${Math.max(4,(d.revenue/maxDaily)*100)}%`,background:'var(--red)',minHeight:'4px'}}/>
                  <span className="text-[9px] sm:text-[10px] whitespace-nowrap" style={{color:'var(--muted)'}}>{fmtDay(d.date)}</span>
                </div>)}
            </div>
          )}
        </div>

        <div className="grid sm:grid-cols-2 gap-3">
          {['delivery','pickup'].map(k=>data.byType[k]&&
            <button key={k} onClick={()=>setTypeFilter(f=>f===k?'all':k)} className="bg-white rounded-2xl p-4 border-2 flex items-center gap-3 text-start transition" style={{borderColor:typeFilter===k?(k==='delivery'?'var(--red)':'var(--ink)'):'var(--line)'}}>
              <span className="w-10 h-10 rounded-xl grid place-items-center text-white shrink-0" style={{background:k==='delivery'?'var(--red)':'var(--ink)'}}>{k==='delivery'?<Ic.truck width="18" height="18"/>:<Ic.bag width="18" height="18"/>}</span>
              <div><div className="font-head" style={{color:'var(--ink)'}}>{k==='delivery'?(ar?'توصيل':'Delivery'):(ar?'استلام':'Pickup')}</div><div className="text-xs" style={{color:'var(--muted)'}}>{data.byType[k].orders} {ar?'طلب':'orders'} · {data.byType[k].revenue} {cur}</div></div>
            </button>)}
        </div>

        <div className="bg-white rounded-2xl p-5 border hairline">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-head" style={{color:'var(--ink)'}}>{ar?'📋 أسماء العملاء':'📋 Customer names'}</h3>
            {typeFilter!=='all'&&<button onClick={()=>setTypeFilter('all')} className="text-xs font-semibold underline" style={{color:'var(--muted)'}}>{ar?'مسح الفلتر (عرض الكل)':'Clear filter (show all)'}</button>}
          </div>
          {typeFilter!=='all'&&<p className="text-xs mb-3" style={{color:'var(--muted)'}}>{ar?`عرض طلبات ${typeFilter==='delivery'?'التوصيل':'الاستلام'} بس`:`Showing ${typeFilter} orders only`}</p>}
          {(()=>{ const list=(data.orders||[]).filter(o=>typeFilter==='all'||o.type===typeFilter);
            return list.length===0 ? <p className="text-sm text-center py-6" style={{color:'var(--muted)'}}>{ar?'لا توجد طلبات':'No orders'}</p> : (
            <div className="space-y-0.5 max-h-80 overflow-y-auto">
              {list.map(o=>
                <div key={o.id} className="flex items-center justify-between text-sm py-2 border-b hairline last:border-0">
                  <div className="min-w-0"><div className="font-semibold truncate" style={{color:'var(--ink)'}}>{o.name||(ar?'بدون اسم':'No name')}</div><div className="text-[11px]" style={{color:'var(--muted)'}}>{o.type==='delivery'?'🚚':'🛍️'} {new Date(o.confirmedAt).toLocaleString(ar?'ar-SA':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
                  <span className="font-semibold shrink-0" style={{color:'var(--red)'}}>{o.total} {cur}</span>
                </div>)}
            </div>);
          })()}
        </div>

        <div className="bg-white rounded-2xl p-5 border hairline">
          <h3 className="font-head mb-4" style={{color:'var(--ink)'}}>{ar?'🏆 أفضل المنتجات مبيعاً':'🏆 Best-selling products'}</h3>
          {data.products.length===0 ? <p className="text-sm text-center py-6" style={{color:'var(--muted)'}}>{ar?'لا توجد مبيعات بهالفترة':'No sales in this period'}</p> : (
            <div className="space-y-2.5">
              {data.products.map((p,i)=>
                <div key={i}>
                  <div className="flex items-center justify-between text-sm mb-1">
                    <span className="font-semibold truncate" style={{color:'var(--ink)'}}>{i<3?['🥇','🥈','🥉'][i]+' ':''}{ar?p.ar:(p.en||p.ar)}</span>
                    <span className="shrink-0" style={{color:'var(--muted)'}}>{p.qty} {ar?'قطعة':'sold'} · <b style={{color:'var(--red)'}}>{p.revenue} {cur}</b></span>
                  </div>
                  <div className="h-2 rounded-full overflow-hidden" style={{background:'var(--paper)'}}><div className="h-full rounded-full" style={{width:`${Math.max(3,(p.revenue/maxProdRev)*100)}%`,background:'var(--red)'}}/></div>
                </div>)}
            </div>
          )}
        </div>
      </>}
      {!loading&&!data&&<p className="text-center py-10" style={{color:'var(--muted)'}}>{ar?'تعذّر تحميل التقرير':'Failed to load report'}</p>}
    </div>
  );
}

function AdminOrders({ar,lang,cur,settings,onChanged,refreshTick,onOrderHandled}){
  const [status,setStatus]=useState('pending');
  const [orders,setOrders]=useState([]); const [loading,setLoading]=useState(true); const [busyId,setBusyId]=useState(null);
  const [drivers,setDrivers]=useState([]);
  const [assign,setAssign]=useState({}); // {orderId: {driverId, time}}
  useEffect(()=>{ apiGet('admin_drivers.php').then(r=>setDrivers(r.drivers||[])).catch(()=>{}); },[]);
  const setAssignField=(orderId,key,val)=>setAssign(a=>({...a,[orderId]:{...(a[orderId]||{driverId:'',time:''}),[key]:val}}));
  const sendDriverMsg=(o,type)=>{
    const pick=assign[o.id]||{}; const driver=drivers.find(d=>String(d.id)===String(pick.driverId));
    if(!driver){ alert(ar?'اختر المندوب أول':'Choose a driver first'); return; }
    const time=(pick.time||'').trim();
    const tplKey=type==='ready'?'msgDriverReady':'msgDriverLate';
    const msg=renderTemplate(settings?.[tplKey]||DEFAULT_MSG_TEMPLATES[tplKey],{
      driver:driver.name, orderId:o.id, customer:o.customer_name||'', area:o.area||'', time,
    });
    window.open(waLink(driver.phone,msg),'_blank');
  };
  const load=()=>{ setLoading(true); apiGet('admin_orders.php?status='+status).then(r=>setOrders(r.orders||[])).catch(()=>setOrders([])).finally(()=>setLoading(false)); };
  useEffect(load,[status]);
  /* نتحدث تلقائي كل ما ينبض فحص لوحة التحكم بالخلفية (كل ٢٠ ثانية) — بدون كذا ما كنت تشوف
     طلب جديد إلا لو تنقلت بين التبويبات يدوي، لأن هذا المكوّن كان يجيب بياناته مرة وحدة بس */
  const firstMount=useRef(true);
  useEffect(()=>{ if(firstMount.current){ firstMount.current=false; return; } if(status==='pending'||status==='scheduled') load(); },[refreshTick]);
  const act=(id,action)=>{ setBusyId(id); apiPost('admin_orders.php',{orderId:id,action}).then(()=>{ load(); onChanged&&onChanged(); onOrderHandled&&onOrderHandled(); }).finally(()=>setBusyId(null)); };
  const cancelOrder=(id)=>{
    if(!confirm(ar?'متأكد تبي تلغي هذا الطلب؟ بيرجع من إحصائيات المبيعات وعداد العميل، ويرجع أي كاش باك اتصرف بسببه.':'Cancel this order? It will be removed from sales stats and the customer\'s counter, and any related cashback will be reversed.')) return;
    act(id,'cancel');
  };
  const tabs=[['pending',ar?'معلقة':'Pending'],['scheduled',ar?'📅 مجدولة':'📅 Scheduled'],['confirmed',ar?'مقبولة':'Confirmed'],['rejected',ar?'مرفوضة':'Rejected'],['cancelled',ar?'ملغاة':'Cancelled']];
  const fmtSched=s=>new Date(s.replace(' ','T')).toLocaleString(ar?'ar-SA':'en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const printReceipt=(o)=>{
    const w=window.open('','_blank','width=400,height=700');
    if(!w){ alert(ar?'المتصفح حجب نافذة الطباعة، فعّل النوافذ المنبثقة وحاول مرة ثانية':'Your browser blocked the print window, allow pop-ups and try again'); return; }
    const itemsHtml=(o.items||[]).map(it=>`<div class="item"><span class="iname">${escapeHtml(ar?it.ar:(it.en||it.ar))}</span><span class="iqty">×${it.q}</span></div>`).join('');
    const brand=escapeHtml((ar?settings?.brandAr:settings?.brandEn)||(ar?'فاتورة الطلب':'Order receipt'));
    const logoSrc=settings?.logo||'';
    const driverMsg=ar
      ? `مرحباً 👋 أنا المندوب من ${(settings?.brandAr)||'المطعم'} 🛵\nطلبك #${o.id} في الطريق، ممكن ترسل لي موقعك الحالي؟ 📍`
      : `Hello 👋 I'm the delivery driver from ${(settings?.brandEn)||'the restaurant'} 🛵\nYour order #${o.id} is on the way, could you send me your current location? 📍`;
    const custWaLink=waLink(o.phone,driverMsg);
    const qrSrc=`https://api.qrserver.com/v1/create-qr-code/?size=170x170&margin=0&data=${encodeURIComponent(custWaLink)}`;
    const phrases=(settings?.receiptPhrases||[]).filter(p=>p&&p.trim());
    const randomPhrase=phrases.length?phrases[Math.floor(Math.random()*phrases.length)]:'';
    const widthPx=Math.round((settings?.receiptWidthMm||54)*3.78);
    const heightMm=settings?.receiptHeightMm||0;
    const pageRule=heightMm>0?`@page{ size:${settings.receiptWidthMm||54}mm ${heightMm}mm; margin:0; }`:'';
    const sc=(settings?.receiptFontScale||100)/100;
    const fs=(base)=>Math.round(base*sc*10)/10;
    const logoPx=settings?.receiptLogoSize??40;
    const qrPx=settings?.receiptQrSize??105;
    const html=`<!DOCTYPE html><html dir="${ar?'rtl':'ltr'}" lang="${ar?'ar':'en'}"><head><meta charset="utf-8"><title>${ar?'فاتورة':'Receipt'} #${o.id}</title>
    <style>
      *{box-sizing:border-box; -webkit-print-color-adjust:exact;}
      ${pageRule}
      body{font-family:'Courier New',ui-monospace,monospace; padding:${fs(14)}px ${fs(10)}px; max-width:${widthPx}px; margin:0 auto; color:#000; background:#fff; font-size:${fs(13)}px;}
      .brandRow{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:2px;}
      .logo{width:${logoPx}px; height:${logoPx}px; object-fit:cover; border-radius:50%; border:2px solid #000; filter:grayscale(1) contrast(1.15);}
      h1{font-size:${fs(18)}px; text-align:center; margin:0; font-weight:800; letter-spacing:.2px;}
      .sub{text-align:center; font-size:${fs(10)}px; margin:5px 0 11px; letter-spacing:.3px;}
      hr{border:none; border-top:1px dashed #000; margin:8px 0;}
      .row{display:flex; justify-content:space-between; gap:6px; padding:2px 0; font-size:${fs(12)}px;}
      .label{font-weight:700;}
      .item{display:flex; justify-content:space-between; gap:6px; padding:2.5px 0; font-size:${fs(12.5)}px;}
      .iqty{font-weight:700; white-space:nowrap;}
      .box{border:1px dashed #000; padding:5px 6px; margin-top:6px; font-size:${fs(11)}px;}
      .total-label{font-size:${fs(12)}px; text-align:center; margin-top:11px; letter-spacing:1.5px;}
      .total-value{font-weight:800; font-size:${fs(32)}px; text-align:center; letter-spacing:.5px; margin-top:2px;}
      .total-value .cur{font-size:${fs(14)}px; font-weight:700;}
      .footer{text-align:center; font-size:${fs(10.5)}px; margin-top:15px;}
      .cut{text-align:center; font-size:${fs(9.5)}px; letter-spacing:2px; margin-top:12px;}
      .qrWrap{text-align:center; margin-top:11px;}
      .qr{width:${qrPx}px; height:${qrPx}px;}
      .qrLabel{font-size:${fs(10)}px; margin-top:3px; font-weight:700;}
    </style></head><body>
      <div class="brandRow">${logoSrc?`<img class="logo" src="${logoSrc}"/>`:''}<h1>${brand}</h1></div>
      <div class="sub">${ar?'طلب':'Order'} #${o.id} · ${new Date(o.created_at).toLocaleString(ar?'ar-SA':'en-US')}</div>
      <hr/>
      <div class="row"><span class="label">${ar?'الاسم':'Name'}</span><span>${escapeHtml(o.customer_name||'-')}</span></div>
      <div class="row"><span class="label">${ar?'الجوال':'Phone'}</span><span dir="ltr">+${escapeHtml(o.phone)}</span></div>
      <div class="row"><span class="label">${ar?'النوع':'Type'}</span><span>${o.order_type==='delivery'?(ar?'توصيل':'Delivery'):(ar?'استلام':'Pickup')}${o.area?(' · '+escapeHtml(o.area)):''}</span></div>
      ${o.scheduled_for?`<div class="box">📅 ${ar?'مجدول لـ':'Scheduled for'} ${fmtSched(o.scheduled_for)}</div>`:''}
      ${o.order_type==='delivery'?`<div class="qrWrap"><img class="qr" src="${qrSrc}"/><div class="qrLabel">📷 ${ar?'امسحه للتواصل مع العميل بالواتساب':'Scan to WhatsApp the customer'}</div></div>`:''}
      <hr/>
      ${itemsHtml}
      <hr/>
      ${o.notes?`<div class="box">📝 ${escapeHtml(o.notes)}</div>`:''}
      <div class="total-label">${ar?'الإجمالي':'TOTAL'}</div>
      <div class="total-value">${o.total}<span class="cur"> ${cur}</span></div>
      <div class="footer">${ar?'🙏 شكراً لطلبك':'🙏 Thank you for your order'}${randomPhrase?`<br/><span style="display:inline-block;margin-top:6px;font-weight:700;">${escapeHtml(randomPhrase)}</span>`:''}</div>
      <div class="cut">✂ - - - - - - - - - - - - - - - -</div>
    </body></html>`;
    w.document.write(html); w.document.close();
    w.onload=()=>{ w.focus(); w.print(); };
  };
  return (
    <div>
      <div className="flex gap-2 mb-4 flex-wrap">{tabs.map(([k,label])=><button key={k} onClick={()=>setStatus(k)} className={`px-4 py-2 rounded-xl text-sm font-semibold border-2 ${status===k?'text-white':'bg-white'}`} style={status===k?{background:'var(--red)',borderColor:'var(--red)'}:{color:'var(--ink)',borderColor:'var(--line)'}}>{label}</button>)}</div>
      {loading&&<p style={{color:'var(--muted)'}}>{ar?'جاري التحميل…':'Loading…'}</p>}
      {!loading&&orders.length===0&&<p className="py-10 text-center" style={{color:'var(--muted)'}}>{status==='scheduled'?(ar?'لا توجد طلبات مجدولة':'No scheduled orders'):(ar?'لا توجد طلبات':'No orders')}</p>}
      <div className="space-y-3">
        {orders.map(o=>{ const isOverdue=o.scheduled_for&&new Date(o.scheduled_for.replace(' ','T'))<=new Date(); return (
          <div key={o.id} className="bg-white rounded-2xl p-4 shadow-card border hairline" style={isOverdue&&status==='pending'?{borderColor:'#F5A623'}:{}}>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
              <div>
                <div className="font-head" style={{color:'var(--ink)'}}>{o.customer_name||(ar?'بدون اسم':'No name')} <span className="text-sm font-body" style={{color:'var(--muted)'}}>· {new Date(o.created_at).toLocaleString(ar?'ar-SA':'en-US')}</span></div>
                <div className="text-sm" style={{color:'var(--muted)'}}>{'+'+o.phone} · {o.order_type==='delivery'?(ar?'توصيل':'Delivery'):(ar?'استلام':'Pickup')}{o.area?(' · '+o.area):''}</div>
              </div>
              <div className="font-head text-lg" style={{color:'var(--red)'}}>{o.total} {cur}</div>
            </div>
            {o.scheduled_for&&
              <div className="text-xs font-semibold rounded-lg px-2.5 py-1.5 mb-2 inline-flex items-center gap-1" style={isOverdue&&status==='pending'?{background:'#FFF3E6',color:'#B4650A'}:{background:'#F1EAFE',color:'#6B3FCC'}}>
                📅 {ar?'مجدول لـ':'Scheduled for'} {fmtSched(o.scheduled_for)}{isOverdue&&status==='pending'?(ar?' — حان وقته':' — due now'):''}
              </div>}
            {o.subscription_product_id&&
              <div className="text-xs font-semibold rounded-lg px-2.5 py-1.5 mb-2 ms-1 inline-flex items-center gap-1" style={{background:'#E7F0FF',color:'#2952CC'}}>
                🔁 {ar?'يفعّل/يجدد اشتراك عند القبول':'Activates/renews subscription on approval'}
              </div>}
            <div className="text-sm space-y-0.5 mb-2">{o.items.map((it,i)=><div key={i} style={{color:'var(--ink)'}}>• {ar?it.ar:(it.en||it.ar)} ×{it.q}</div>)}</div>
            {o.cashback_redeemed>0&&
              <div className="text-xs font-semibold rounded-lg px-2.5 py-1.5 mb-2 inline-block" style={{background:'#E7F0FF',color:'#2952CC'}}>
                {ar?`💳 استُخدم كاش باك سابق: -${o.cashback_redeemed} ${cur} — الصافي المطلوب: ${o.net_total} ${cur}`:`💳 Previous cashback applied: -${o.cashback_redeemed} ${cur} — Net due: ${o.net_total} ${cur}`}
              </div>}
            {o.notes&&<div className="text-xs mb-2" style={{color:'var(--muted)'}}>📝 {o.notes}</div>}
            {status==='confirmed'&&o.order_type==='delivery'&&
              <div className="rounded-xl border hairline p-2.5 mb-2" style={{background:'var(--paper)'}}>
                <div className="text-[11px] font-semibold mb-1.5" style={{color:'var(--muted)'}}>🛵 {ar?'راسل المندوب':'Message the driver'}</div>
                <div className="flex flex-wrap gap-1.5 mb-1.5">
                  <select value={(assign[o.id]||{}).driverId||''} onChange={e=>setAssignField(o.id,'driverId',e.target.value)} className="flex-1 min-w-[110px] px-2 py-1.5 rounded-lg border hairline text-xs" style={{color:'var(--ink)'}}>
                    <option value="">{ar?'اختر المندوب':'Choose driver'}</option>
                    {drivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                  <input value={(assign[o.id]||{}).time||''} onChange={e=>setAssignField(o.id,'time',e.target.value)} placeholder={ar?'الوقت (مثال: 10 دقايق)':'Time (e.g. 10 min)'} className="flex-1 min-w-[110px] px-2 py-1.5 rounded-lg border hairline text-xs" style={{color:'var(--ink)'}}/>
                </div>
                <div className="flex gap-1.5">
                  <button onClick={()=>sendDriverMsg(o,'ready')} className="flex-1 py-1.5 rounded-lg text-xs font-semibold text-white flex items-center justify-center gap-1" style={{background:'#25D366'}}><Ic.wa width="12" height="12"/>{ar?'جهّزه':'Get ready'}</button>
                  <button onClick={()=>sendDriverMsg(o,'late')} className="flex-1 py-1.5 rounded-lg text-xs font-semibold" style={{background:'#FCE3E5',color:'var(--redd)'}}>⏰ {ar?'متأخر':'Late'}</button>
                </div>
              </div>}
            <div className="flex items-center gap-2">
              <a href={waLink(o.phone,'')} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1" style={{background:'#E7F8EE',color:'#1E8E4F'}}><Ic.wa width="14" height="14"/>{ar?'واتساب':'WhatsApp'}</a>
              <button onClick={()=>printReceipt(o)} className="px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1" style={{background:'#EFEAE0',color:'var(--ink)'}}>🖨️ {ar?'طباعة':'Print'}</button>
              {(status==='pending'||status==='scheduled')&&<>
                <button disabled={busyId===o.id} onClick={()=>act(o.id,'approve')} className="px-3 py-1.5 rounded-lg text-sm font-semibold text-white" style={{background:'#25D366'}}>{ar?'قبول ✓':'Approve ✓'}</button>
                <button disabled={busyId===o.id} onClick={()=>act(o.id,'reject')} className="px-3 py-1.5 rounded-lg text-sm font-semibold" style={{background:'#FCE3E5',color:'var(--redd)'}}>{ar?'رفض':'Reject'}</button>
              </>}
              {status==='confirmed'&&
                <button disabled={busyId===o.id} onClick={()=>cancelOrder(o.id)} className="px-3 py-1.5 rounded-lg text-sm font-semibold" style={{background:'#FCE3E5',color:'var(--redd)'}}>❌ {ar?'إلغاء الطلب':'Cancel order'}</button>}
            </div>
          </div>
        );})}
      </div>
    </div>
  );
}

/* ===== ADMIN: العملاء المتكررون + الكاش باك القريب من الانتهاء ===== */
/* ===== ADMIN: سلات متروكة (عميل حط أصناف وكتب رقمه بس ما أرسل الطلب) ===== */
function AdminCarts({ar,lang,cur,onChanged}){
  const [carts,setCarts]=useState([]); const [loading,setLoading]=useState(true); const [busyId,setBusyId]=useState(null); const [busyAll,setBusyAll]=useState(false);
  const load=()=>{ setLoading(true); apiGet('admin_carts.php').then(r=>setCarts(r.carts||[])).catch(()=>setCarts([])).finally(()=>setLoading(false)); };
  useEffect(load,[]);
  const remind=(c)=>{
    apiPost('admin_carts.php',{action:'remind',id:c.id}).catch(()=>{});
    setCarts(cs=>cs.map(x=>x.id===c.id?{...x,reminder_sent:true}:x));
    onChanged&&onChanged();
  };
  const deleteCart=(c)=>{
    setBusyId(c.id);
    apiPost('admin_carts.php',{action:'delete',id:c.id})
      .then(()=>{ setCarts(cs=>cs.filter(x=>x.id!==c.id)); onChanged&&onChanged(); })
      .catch(()=>alert(ar?'فشل الحذف':'Delete failed'))
      .finally(()=>setBusyId(null));
  };
  const deleteAll=()=>{
    if(!confirm(ar?`تأكيد حذف كل السلات المتروكة (${carts.length})؟`:`Delete all abandoned carts (${carts.length})?`)) return;
    setBusyAll(true);
    apiPost('admin_carts.php',{action:'deleteAll'})
      .then(()=>{ setCarts([]); onChanged&&onChanged(); })
      .catch(()=>alert(ar?'فشل الحذف':'Delete failed'))
      .finally(()=>setBusyAll(false));
  };
  const msg=(c)=>{ const l=[]; l.push(ar?`مرحباً ${c.customer_name||''}! 🍣`:`Hi ${c.customer_name||''}! 🍣`);
    l.push(ar?`لاحظنا عندك أصناف بسلة الطلب ما أرسلتها بعد:`:`We noticed you have items in your cart that weren't sent yet:`);
    (c.items||[]).forEach(it=>l.push(`• ${ar?it.ar:(it.en||it.ar)} ×${it.q}`));
    l.push((ar?'الإجمالي: ':'Total: ')+c.total+' '+cur);
    l.push(ar?'تبي نكمّل طلبك؟ 😊':'Want us to complete your order? 😊');
    return l.join('\n'); };
  const fmtAge=m=> m<60 ? (ar?`قبل ${m} دقيقة`:`${m} min ago`) : (ar?`قبل ${Math.floor(m/60)} ساعة`:`${Math.floor(m/60)}h ago`);
  return (
    <div>
      <div className="flex items-start justify-between gap-2 mb-1">
        <h3 className="font-head text-xl" style={{color:'var(--ink)'}}>{ar?`سلات متروكة (${carts.length})`:`Abandoned carts (${carts.length})`}</h3>
        {carts.length>0&&<button disabled={busyAll} onClick={deleteAll} className="px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0 flex items-center gap-1" style={{background:'#FCE3E5',color:'var(--redd)'}}><Ic.trash width="13" height="13"/>{ar?'حذف الكل':'Delete all'}</button>}
      </div>
      <p className="text-sm mb-4" style={{color:'var(--muted)'}}>{ar?'عملاء حطوا أصناف بالسلة وكتبوا رقمهم لكن ما ضغطوا "إرسال عبر واتساب" بعد. تختفي من هنا تلقائي أول ما يرسلوا الطلب أو تفرغ سلتهم، وتنحذف تلقائي كل يوم عند الساعة ١٢ ظهراً.':'Customers who added items and entered their phone but haven\'t pressed "Send via WhatsApp" yet. Disappears automatically once they order or empty their cart, and auto-clears daily at 12 PM.'}</p>
      {loading&&<p style={{color:'var(--muted)'}}>{ar?'جاري التحميل…':'Loading…'}</p>}
      {!loading&&carts.length===0&&<p className="py-10 text-center" style={{color:'var(--muted)'}}>{ar?'ما فيه سلات متروكة حالياً 🎉':'No abandoned carts right now 🎉'}</p>}
      <div className="space-y-3">
        {carts.map(c=>
          <div key={c.id} className="bg-white rounded-2xl p-4 shadow-card border hairline" style={c.ageMinutes>=20&&!c.reminder_sent?{borderColor:'#E8743C'}:{}}>
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
              <div>
                <div className="font-head" style={{color:'var(--ink)'}}>{c.customer_name||(ar?'بدون اسم':'No name')} <span className="text-sm font-body" style={{color:'var(--muted)'}}>· {'+'+c.phone}</span></div>
                <div className="text-xs" style={{color:c.ageMinutes>=20?'#E8743C':'var(--muted)'}}>{fmtAge(c.ageMinutes)}{c.reminder_sent&&(ar?' · تم التذكير من قبل':' · already reminded')}</div>
              </div>
              <div className="font-head text-lg" style={{color:'var(--red)'}}>{c.total} {cur}</div>
            </div>
            <div className="text-sm space-y-0.5 mb-3">{(c.items||[]).map((it,i)=><div key={i} style={{color:'var(--ink)'}}>• {ar?it.ar:(it.en||it.ar)} ×{it.q}</div>)}</div>
            <div className="flex items-center gap-2">
              <a href={waLink(c.phone,msg(c))} target="_blank" rel="noopener" onClick={()=>remind(c)} className="px-4 py-2 rounded-xl text-sm font-semibold text-white flex items-center gap-1.5 w-fit" style={{background:'#25D366'}}><Ic.wa width="15" height="15"/>{c.reminder_sent?(ar?'إعادة التذكير':'Remind again'):(ar?'ذكّره الآن':'Remind now')}</a>
              <button disabled={busyId===c.id} onClick={()=>deleteCart(c)} className="px-3 py-2 rounded-xl text-sm font-semibold" style={{background:'#FCE3E5',color:'var(--redd)'}}><Ic.trash width="14" height="14"/></button>
            </div>
          </div>)}
      </div>
    </div>
  );
}

/* ===== ADMIN DRIVERS ===== */
function AdminDrivers({ar,lang}){
  const [drivers,setDrivers]=useState([]); const [loading,setLoading]=useState(true);
  const [name,setName]=useState(''); const [phone,setPhone]=useState(''); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const [editId,setEditId]=useState(null); const [editName,setEditName]=useState(''); const [editPhone,setEditPhone]=useState('');
  const load=()=>{ setLoading(true); apiGet('admin_drivers.php').then(r=>setDrivers(r.drivers||[])).catch(()=>setDrivers([])).finally(()=>setLoading(false)); };
  useEffect(load,[]);
  const addDriver=()=>{
    if(!name.trim()){ setErr(ar?'اكتب اسم المندوب':'Enter driver name'); return; }
    if(!isValidSaPhone(phone)){ setErr(ar?'رقم جوال غير صحيح':'Invalid phone number'); return; }
    setErr(''); setBusy(true);
    apiPost('admin_drivers.php',{action:'add',name:name.trim(),phone})
      .then(()=>{ setName(''); setPhone(''); load(); })
      .catch(e=>setErr(e.message||(ar?'صار خطأ':'Something went wrong')))
      .finally(()=>setBusy(false));
  };
  const startEdit=(d)=>{ setEditId(d.id); setEditName(d.name); setEditPhone(d.phone); };
  const saveEdit=()=>{
    setBusy(true);
    apiPost('admin_drivers.php',{action:'edit',id:editId,name:editName.trim(),phone:editPhone})
      .then(()=>{ setEditId(null); load(); })
      .catch(e=>alert(e.message||(ar?'صار خطأ':'Something went wrong')))
      .finally(()=>setBusy(false));
  };
  const deleteDriver=(id)=>{
    if(!confirm(ar?'حذف هذا المندوب؟':'Delete this driver?')) return;
    apiPost('admin_drivers.php',{action:'delete',id}).then(load);
  };
  return (
    <div>
      <h3 className="font-head text-xl mb-1" style={{color:'var(--ink)'}}>{ar?`🛵 المناديب (${drivers.length})`:`🛵 Drivers (${drivers.length})`}</h3>
      <p className="text-sm mb-4" style={{color:'var(--muted)'}}>{ar?'سجّل مناديبك هنا، وبعدها من كل طلب توصيل مقبول تقدر تراسلهم بضغطة واحدة برسالة جاهزة.':'Register your drivers here, then message them with one tap from any confirmed delivery order using a ready-made message.'}</p>

      <div className="bg-white rounded-2xl p-4 border hairline mb-5">
        <div className="grid sm:grid-cols-2 gap-2 mb-2">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder={ar?'اسم المندوب':'Driver name'} className={inputCls+' text-sm py-2'}/>
          <input value={phone} onChange={e=>{setPhone(e.target.value);setErr('');}} dir="ltr" placeholder="05XXXXXXXX" className={inputCls+' text-sm py-2'}/>
        </div>
        {err&&<p className="text-xs mb-2" style={{color:'var(--red)'}}>{err}</p>}
        <button disabled={busy} onClick={addDriver} className="w-full py-2.5 rounded-xl text-sm font-semibold text-white flex items-center justify-center gap-1.5 disabled:opacity-60" style={{background:'var(--red)'}}><Ic.plus width="15" height="15"/>{ar?'إضافة مندوب':'Add driver'}</button>
      </div>

      {loading&&<p style={{color:'var(--muted)'}}>{ar?'جاري التحميل…':'Loading…'}</p>}
      {!loading&&drivers.length===0&&<p className="text-center py-8" style={{color:'var(--muted)'}}>{ar?'ما فيه مناديب مسجّلين بعد':'No drivers registered yet'}</p>}
      <div className="space-y-2">
        {drivers.map(d=>
          <div key={d.id} className="bg-white rounded-2xl p-3.5 border hairline">
            {editId===d.id ? (
              <div className="space-y-2">
                <div className="grid sm:grid-cols-2 gap-2">
                  <input value={editName} onChange={e=>setEditName(e.target.value)} className={inputCls+' text-sm py-2'}/>
                  <input value={editPhone} onChange={e=>setEditPhone(e.target.value)} dir="ltr" className={inputCls+' text-sm py-2'}/>
                </div>
                <div className="flex gap-2">

                  <td className="p-3">

                      : c.isFrequent

                      : isAlmostThere
                      ? <a href={waLink(c.phone,pushMsg(c.name,c.order_count))} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-white flex items-center gap-1 w-fit" style={{background:'#E8743C'}}><Ic.wa width="13" height="13"/>{ar?'حثّه يكمل':'Nudge them'}</a>
                      : <a href={waLink(c.phone,'')} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 w-fit" style={{background:'#E7F8EE',color:'#1E8E4F'}}><Ic.wa width="13" height="13"/>{ar?'واتساب':'WhatsApp'}</a>}
                  </td>
                </tr>);})}
            </tbody>
          </table>
        </div></>}
      </div>
      {manualOpen&&
      <div className="fixed inset-x-0 top-0 z-[60] grid place-items-center p-4" style={{height:'100dvh'}} onClick={()=>!manualBusy&&setManualOpen(false)}>

          <h3 className="font-head text-lg mb-1 flex items-center gap-2" style={{color:'var(--ink)'}}>➕ {ar?'إضافة طلب يدوياً':'Add order manually'}</h3>
          <p className="text-xs mb-4" style={{color:'var(--muted)'}}>{ar?'الصق رسالة الطلب اللي جتك بواتساب — بنحاول نعبّي البيانات تلقائياً، وتقدر تصححها قبل التسجيل.':'Paste the order message you got on WhatsApp — we\'ll try to auto-fill the fields below, and you can correct them before saving.'}</p>
          {manualDone ? (
            <div className="py-8 text-center">
              <div className="text-4xl mb-2">✅</div>
              <p className="font-head" style={{color:'#1E8E4F'}}>{ar?'تم تسجيل الطلب بنجاح':'Order registered successfully'}</p>
            </div>
          ) : (<>
          <textarea value={manualText} onChange={e=>onManualTextChange(e.target.value)} placeholder={ar?'الصق نص رسالة واتساب هنا…':'Paste the WhatsApp message text here…'} rows="6" className={inputCls+' resize-none mb-3 text-sm'} dir="rtl"/>
          <div className="grid grid-cols-2 gap-2 mb-2">
            <Field label={ar?'الاسم':'Name'}><input className={inputCls+' py-2 text-sm'} value={manualName} onChange={e=>setManualName(e.target.value)}/></Field>
            <Field label={ar?'الجوال':'Phone'}><input className={inputCls+' py-2 text-sm'} dir="ltr" value={manualPhone} onChange={e=>setManualPhone(e.target.value)} placeholder="05XXXXXXXX"/></Field>
          </div>
          <Field label={ar?'الإجمالي (ر.س)':'Total (SAR)'}><input type="number" className={inputCls+' py-2 text-sm'} dir="ltr" value={manualTotal} onChange={e=>setManualTotal(e.target.value)}/></Field>
          {manualItems.length>0&&
            <div className="mt-2 text-xs rounded-lg p-2.5 space-y-0.5" style={{background:'var(--paper)',color:'var(--ink)'}}>
              <div className="font-semibold mb-1">{ar?`تم التعرّف على ${manualItems.length} صنف:`:`Recognized ${manualItems.length} item(s):`}</div>
              {manualItems.map((it,i)=><div key={i}>• {it.ar} ×{it.q}</div>)}
            </div>}
          {manualErr&&<p className="text-xs mt-2" style={{color:'var(--red)'}}>{manualErr}</p>}
          <div className="flex gap-2 mt-5">
            <button type="button" disabled={manualBusy} onClick={()=>setManualOpen(false)} className="flex-1 py-2.5 rounded-xl font-head text-sm border-2 hairline disabled:opacity-50" style={{color:'var(--ink)'}}>{ar?'إلغاء':'Cancel'}</button>
            <button type="button" disabled={manualBusy} onClick={submitManual} className="flex-1 py-2.5 rounded-xl font-head text-sm text-white disabled:opacity-60" style={{background:'#2952CC'}}>{manualBusy?'…':(ar?'تسجيل الطلب':'Register order')}</button>
          </div>
          </>)}
        </div>
      </div>}
    </div>
  );
}

/* ===== ADMIN: رسالة جماعية (يدوي — زر لكل عميل يفتح واتساب برسالة جاهزة) ===== */
function AdminBroadcast({ar,settings}){
  const [msg,setMsg]=useState(()=>settings.msgBroadcastDefault||''); const [customers,setCustomers]=useState([]); const [loading,setLoading]=useState(true); const [logged,setLogged]=useState(false);
  const [opening,setOpening]=useState(false); const [openedCount,setOpenedCount]=useState(0);
  useEffect(()=>{ apiGet('admin_broadcast.php').then(r=>setCustomers(r.customers||[])).catch(()=>setCustomers([])).finally(()=>setLoading(false)); },[]);
  const logSend=()=>{ if(!msg.trim()) return; apiPost('admin_broadcast.php',{message:msg,recipientsCount:customers.length}).then(()=>{ setLogged(true); setTimeout(()=>setLogged(false),1800); }); };
  const openAll=()=>{
    if(!msg.trim()||customers.length===0) return;
    setOpening(true); setOpenedCount(0);
    customers.forEach((c,i)=>{
      setTimeout(()=>{
        window.open(waLink(c.phone,msg),'_blank');
        setOpenedCount(n=>n+1);
        if(i===customers.length-1) setOpening(false);
      }, i*400);
    });
    logSend();
  };
  return (
    <div>
      <h3 className="font-head text-xl mb-1" style={{color:'var(--ink)'}}>{ar?'رسالة جماعية':'Broadcast message'}</h3>
      <p className="text-sm mb-1" style={{color:'var(--muted)'}}>{ar?'اكتب الرسالة مرة وحدة. زر "فتح الكل" يفتح لك محادثة كل عميل بنفس الرسالة جاهزة تباعاً بدون ما تدخل عميل عميل.':'Write the message once. "Open all" opens every customer\'s chat pre-filled with this message, one after another.'}</p>
      <p className="text-xs mb-3 rounded-lg px-3 py-2" style={{background:'#FFF3E6',color:'#B4650A'}}>
        {ar
          ? '⚠️ واتساب نفسه ما يسمح بإرسال تلقائي بدون تدخل بشري — رح تنفتح لك نافذة لكل عميل والرسالة جاهزة، لكن لازم تضغط زر الإرسال داخل واتساب لكل واحدة يدوياً (هذا قيد من واتساب مو من الموقع). فعّل السماح بالنوافذ المنبثقة (popups) للموقع عشان تفتح كلها.'
          : '⚠️ WhatsApp itself doesn\'t allow fully automatic sending — a window opens per customer with the message ready, but you still tap Send inside WhatsApp for each one (a WhatsApp platform limit, not this site). Allow popups for this site so all windows can open.'}
      </p>
      <textarea value={msg} onChange={e=>setMsg(e.target.value)} rows="3" placeholder={ar?'مثال: عرض اليوم! خصم ١٥٪ على كل الرولز 🍣':'e.g. Today only! 15% off all rolls 🍣'} className={inputCls+' resize-none mb-3'}/>
      <div className="flex flex-wrap gap-2 mb-5">
        <button onClick={openAll} disabled={!msg.trim()||opening||customers.length===0} className="px-4 py-2 rounded-xl text-sm font-semibold text-white disabled:opacity-50 flex items-center gap-2" style={{background:'#25D366'}}>
          <Ic.wa width="15" height="15"/>{opening?(ar?`جاري الفتح… ${openedCount}/${customers.length}`:`Opening… ${openedCount}/${customers.length}`):(ar?`فتح الكل دفعة وحدة (${customers.length})`:`Open all at once (${customers.length})`)}
        </button>
        <button onClick={logSend} disabled={!msg.trim()} className="px-4 py-2 rounded-xl text-sm font-semibold text-white disabled:opacity-50" style={{background:logged?'#25D366':'var(--ink)'}}>{logged?(ar?'تم الأرشفة ✓':'Logged ✓'):(ar?'حفظ الرسالة فقط (أرشفة)':'Just log message')}</button>
      </div>
      <div className="text-sm font-semibold mb-2" style={{color:'var(--muted)'}}>{ar?`العملاء (${customers.length}) — أو أرسل لواحد لحاله:`:`Customers (${customers.length}) — or send to one individually:`}</div>
      {loading&&<p style={{color:'var(--muted)'}}>{ar?'جاري التحميل…':'Loading…'}</p>}
      <div className="space-y-2 max-h-[50vh] overflow-auto">
        {customers.map(c=>
          <div key={c.id} className="bg-white rounded-xl p-3 flex items-center justify-between gap-3 border hairline">
            <div className="text-sm"><span className="font-head" style={{color:'var(--ink)'}}>{c.name||(ar?'عميل':'Customer')}</span> <span style={{color:'var(--muted)'}}>· {'+'+c.phone}</span></div>
            {msg.trim()
              ? <a href={waLink(c.phone,msg)} target="_blank" rel="noopener" className="px-3 py-1.5 rounded-lg text-xs font-semibold text-white flex items-center gap-1" style={{background:'#25D366'}}><Ic.wa width="13" height="13"/>{ar?'إرسال':'Send'}</a>
              : <span className="text-xs" style={{color:'var(--muted)'}}>{ar?'اكتب رسالة أولاً':'Write a message first'}</span>}
          </div>)}
      </div>
    </div>
  );
}

  const remove=id=>{ if(confirm(t('confirmDel'))) setProducts(ps=>ps.filter(p=>p.id!==id)); };

              <button onClick={()=>toggleStock(p.id)} className="w-full mt-3 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-1.5 border-2" style={outOfStock?{background:'#FCE3E5',color:'var(--redd)',borderColor:'#FCE3E5'}:{background:'#E7F8EE',color:'#1E8E4F',borderColor:'#E7F8EE'}}>
                {outOfStock ? <>⛔ {ar?'نفذت الكمية — اضغط للتفعيل':'Sold out — tap to restock'}</> : <>✅ {ar?'متوفر — اضغط لتعليمه نفذ':'Available — tap to mark sold out'}</>}
              </button>
              <div className="flex gap-2 mt-2"><button onClick={()=>setEdit({...p})} className="flex-1 py-1.5 rounded-lg text-sm border-2 hairline hover:bg-paper-deep font-semibold">{t('edit')}</button><button onClick={()=>remove(p.id)} className="px-3 py-1.5 rounded-lg text-sm" style={{background:'#FCE3E5',color:'var(--redd)'}}><Ic.trash width="15" height="15"/></button></div>
            </div>
          </div>
        );})}

      {edit&&<Modal title={edit.id?t('edit'):t('addProduct')} onClose={()=>setEdit(null)} onSave={save} t={t}>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label={t('nameAr')}><input className={inputCls} dir="rtl" value={edit.ar} onChange={e=>setEdit({...edit,ar:e.target.value})}/></Field>
          <Field label={t('nameEn')}><input className={inputCls} dir="ltr" value={edit.en} onChange={e=>setEdit({...edit,en:e.target.value})}/></Field>
          <Field label={t('descAr')}><input className={inputCls} dir="rtl" value={edit.dAr} onChange={e=>setEdit({...edit,dAr:e.target.value})}/></Field>
          <Field label={t('descEn')}><input className={inputCls} dir="ltr" value={edit.dEn} onChange={e=>setEdit({...edit,dEn:e.target.value})}/></Field>
          <Field label={t('price')}><input className={inputCls} type="number" value={edit.price} onChange={e=>setEdit({...edit,price:e.target.value})}/></Field>
          <Field label={ar?'سعر بعد الخصم (اختياري)':'Sale price (optional)'}><input className={inputCls} type="number" placeholder={ar?'اتركه فاضي لو ما فيه خصم يدوي':'Leave empty if no manual discount'} value={edit.salePrice} onChange={e=>setEdit({...edit,salePrice:e.target.value})}/></Field>
          <Field label={t('category')}><select className={inputCls} value={edit.cat} onChange={e=>setEdit({...edit,cat:e.target.value})}>{cats.map(c=><option key={c.id} value={c.id}>{L(c)}</option>)}</select></Field>
        </div>

          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={!!edit.isAddon} onChange={e=>setEdit({...edit,isAddon:e.target.checked})} className="w-4 h-4 accent-red"/><span className="font-semibold text-sm">{ar?'🧩 إضافة سريعة بالسلة (مشروب، أعواد...)':'🧩 Quick add-on in cart (drink, chopsticks...)'}</span></label>
          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={!!edit.extrasEnabled} onChange={e=>setEdit({...edit,extrasEnabled:e.target.checked})} className="w-4 h-4 accent-red"/><span className="font-semibold text-sm">{ar?'➕ خيارات إضافية (للبوكسات مثلاً)':'➕ Extra options (e.g. for boxes)'}</span></label>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3 p-3 rounded-xl" style={{background:'var(--paper)'}}>
          <Field label={ar?'مدة الاشتراك (يوم)':'Subscription length (days)'}><input type="number" className={inputCls} value={edit.subDays||30} onChange={e=>setEdit({...edit,subDays:e.target.value})}/></Field>
          <div className="hidden sm:block"/>
          <Field label={ar?'الميزة (عربي) — مثال: توصيل مجاني':'Benefit (AR) — e.g. Free delivery'}><input className={inputCls} dir="rtl" value={edit.subBenefitAr||''} onChange={e=>setEdit({...edit,subBenefitAr:e.target.value})}/></Field>
          <Field label={ar?'الميزة (إنجليزي)':'Benefit (EN)'}><input className={inputCls} dir="ltr" value={edit.subBenefitEn||''} onChange={e=>setEdit({...edit,subBenefitEn:e.target.value})}/></Field>
        </div>}
        {edit.extrasEnabled&&

                <div key={i} className="flex flex-col sm:flex-row gap-2">

                  <input value={ex.en||''} onChange={e=>upEx('en',e.target.value)} placeholder="Option (EN)" className={inputCls+' text-sm py-2'} dir="ltr"/>

                  <button onClick={()=>setEdit({...edit,extras:(edit.extras||[]).filter((_,x)=>x!==i)})} className="px-3 py-2 rounded-lg shrink-0 self-end sm:self-auto" style={{background:'#FCE3E5',color:'var(--redd)'}}><Ic.trash width="14" height="14"/></button>
                </div>
              );

            {(edit.extras||[]).length===0&&<p className="text-sm py-1 text-center" style={{color:'var(--muted)'}}>{ar?'ما فيه خيارات بعد':'No options yet'}</p>}
          </div>
          <button onClick={()=>setEdit({...edit,extras:[...(edit.extras||[]),{ar:'',en:'',price:0}]})} className="px-3 py-1.5 rounded-lg text-sm text-white flex items-center gap-1" style={{background:'var(--red)'}}><Ic.plus width="14" height="14"/>{ar?'إضافة خيار':'Add option'}</button>
        </div>}
      </Modal>}
    </div>
  );
}
function AdminCats({t,ar,L,cats,setCats,products,setProducts}){
  const [edit,setEdit]=useState(null);
  const save=()=>{ if(!edit.ar&&!edit.en){ alert(ar?'أدخل اسم القسم':'Enter name'); return; } setCats(cs=>edit.id?cs.map(c=>c.id===edit.id?edit:c):[...cs,{...edit,id:'c_'+uid()}]); setEdit(null); };
  const remove=id=>{ const used=products.filter(p=>p.cat===id).length; if(used>0){ if(!confirm(ar?`هذا القسم فيه ${used} منتج. حذف القسم سيحذف منتجاته. متابعة؟`:`This category has ${used} products. Continue?`)) return; setProducts(ps=>ps.filter(p=>p.cat!==id)); } else if(!confirm(t('confirmDel'))) return; setCats(cs=>cs.filter(c=>c.id!==id)); };
  const move=(i,dir)=>{ const j=i+dir; if(j<0||j>=cats.length) return; setCats(cs=>{ const a=[...cs]; [a[i],a[j]]=[a[j],a[i]]; return a; }); };
  return (
    <div>
      <div className="flex justify-between items-center mb-4"><h3 className="font-head text-xl" style={{color:'var(--ink)'}}>{t('categories')}</h3><button onClick={()=>setEdit({id:'',ar:'',en:''})} className="px-4 py-2 rounded-xl text-white font-head flex items-center gap-2" style={{background:'var(--red)'}}><Ic.plus width="16" height="16"/>{t('addCat')}</button></div>
      <p className="text-xs mb-3" style={{color:'var(--muted)'}}>{ar?'رتّب الأقسام بالأسهم — القائمة والمنتجات بالموقع تطلع بنفس هذا الترتيب.':'Reorder categories with the arrows — the menu and products on the site follow this same order.'}</p>
      <div className="space-y-2 max-w-xl">
        {cats.map((c,i)=><div key={c.id} className="bg-white rounded-xl p-4 flex items-center justify-between shadow-card border hairline">
          <div className="flex items-center gap-2">
            <div className="flex flex-col gap-0.5 shrink-0">
              <button onClick={()=>move(i,-1)} disabled={i===0} className="w-6 h-5 grid place-items-center rounded border hairline disabled:opacity-25"><Ic.chevronUp width="12" height="12"/></button>
              <button onClick={()=>move(i,1)} disabled={i===cats.length-1} className="w-6 h-5 grid place-items-center rounded border hairline disabled:opacity-25"><Ic.chevronDown width="12" height="12"/></button>
            </div>
