              <button onClick={()=>up('receiptPhrases',(d.receiptPhrases||[]).filter((_,x)=>x!==i))} className="px-2.5 py-2 rounded-lg shrink-0" style={{background:'#FCE3E5',color:'var(--redd)'}}><Ic.trash width="14" height="14"/></button>
            </div>)}
          {(d.receiptPhrases||[]).length===0&&<p className="text-sm py-2 text-center" style={{color:'var(--muted)'}}>{ar?'ما فيه عبارات بعد':'No phrases yet'}</p>}
        </div>
        <button onClick={()=>up('receiptPhrases',[...(d.receiptPhrases||[]),''])} className="px-3 py-1.5 rounded-lg text-sm text-white flex items-center gap-1" style={{background:'var(--red)'}}><Ic.plus width="14" height="14"/>{ar?'إضافة عبارة':'Add phrase'}</button>
      </Collapsible>
      <Collapsible title={t('salesPoints')}>
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm" style={{color:'var(--muted)'}}>{t('salesKick')}</span>
          <button onClick={addSP} className="px-3 py-1.5 rounded-lg text-sm text-white flex items-center gap-1" style={{background:'var(--red)'}}><Ic.plus width="14" height="14"/>{t('addSalesPoint')}</button>
        </div>
        {(d.salesPoints||[]).length===0 && <p className="text-sm py-3 text-center" style={{color:'var(--muted)'}}>{t('noSalesPoints')}</p>}
        <div className="space-y-4">
          {(d.salesPoints||[]).map((p,i)=>
            <div key={p.id||i} className="rounded-2xl border-2 hairline p-4 bg-paper">
              <div className="flex items-center justify-between mb-3">
                <span className="font-head text-sm" style={{color:'var(--red)'}}>#{i+1}</span>
                <button onClick={()=>delSP(i)} className="px-2.5 py-1 rounded-lg text-xs flex items-center gap-1" style={{background:'#FCE3E5',color:'var(--redd)'}}><Ic.trash width="14" height="14"/>{t('del')}</button>
              </div>
              <div className="mb-3"><ImagePicker value={p.image} onChange={v=>setSP(i,'image',v)} label={t('spImage')} t={t}/></div>
              <div className="grid sm:grid-cols-2 gap-3">
                <Field label={t('spName')+' (ع)'}><input className={inputCls} dir="rtl" value={p.nameAr||''} onChange={e=>setSP(i,'nameAr',e.target.value)}/></Field>
                <Field label={t('spName')+' (EN)'}><input className={inputCls} dir="ltr" value={p.nameEn||''} onChange={e=>setSP(i,'nameEn',e.target.value)}/></Field>
                <Field label={t('spDesc')+' (ع)'}><input className={inputCls} dir="rtl" value={p.descAr||''} onChange={e=>setSP(i,'descAr',e.target.value)}/></Field>
                <Field label={t('spDesc')+' (EN)'}><input className={inputCls} dir="ltr" value={p.descEn||''} onChange={e=>setSP(i,'descEn',e.target.value)}/></Field>
                <Field label={t('spAddress')+' (ع)'}><input className={inputCls} dir="rtl" value={p.addressAr||''} onChange={e=>setSP(i,'addressAr',e.target.value)}/></Field>
                <Field label={t('spAddress')+' (EN)'}><input className={inputCls} dir="ltr" value={p.addressEn||''} onChange={e=>setSP(i,'addressEn',e.target.value)}/></Field>
                <Field label={ar?'رابط خرائط جوجل':'Google Maps URL'}><input className={inputCls} dir="ltr" value={p.mapUrl||''} onChange={e=>setSP(i,'mapUrl',e.target.value)}/></Field>
                <Field label={t('mapBtnLabel')+' (ع)'}><input className={inputCls} dir="rtl" placeholder="الموقع على الخريطة" value={p.mapLabelAr||''} onChange={e=>setSP(i,'mapLabelAr',e.target.value)}/></Field>
                <Field label={t('mapBtnLabel')+' (EN)'}><input className={inputCls} dir="ltr" placeholder="Location on map" value={p.mapLabelEn||''} onChange={e=>setSP(i,'mapLabelEn',e.target.value)}/></Field>
                <Field label={t('whatsNo')}><input className={inputCls} dir="ltr" placeholder="9665xxxxxxxx" value={p.whatsapp||''} onChange={e=>setSP(i,'whatsapp',e.target.value)}/></Field>
                <Field label="Instagram"><input className={inputCls} dir="ltr" placeholder="@username" value={p.instagram||''} onChange={e=>setSP(i,'instagram',e.target.value)}/></Field>
              </div>
            </div>)}
        </div>
      </Collapsible>

      <Collapsible title={ar?'🖨️ مقاس الفاتورة المطبوعة':'🖨️ Printed receipt size'}>
        <p className="text-xs mb-3" style={{color:'var(--muted)'}}>{ar?'اضبط كل أبعاد الفاتورة حسب طابعتك، وجرّب اطبع فاتورة تجريبية بعد كل تعديل لين توصل للمقاس المناسب.':'Adjust every receipt dimension to match your printer, and test-print after each change until it fits well.'}</p>
        <div className="grid grid-cols-2 gap-3">
          <Field label={ar?'عرض الورق (ملم)':'Paper width (mm)'}>
            <input type="number" min="30" max="120" value={d.receiptWidthMm??54} onChange={e=>up('receiptWidthMm', e.target.value===''?'':Number(e.target.value))} onBlur={e=>up('receiptWidthMm',Math.max(30,Math.min(120,Number(e.target.value)||54)))} className={inputCls} dir="ltr"/>
          </Field>
          <Field label={ar?'طول الورق (ملم — اتركه 0 لطول تلقائي حسب المحتوى)':'Paper length (mm — leave 0 for auto)'}>
            <input type="number" min="0" max="500" value={d.receiptHeightMm??0} onChange={e=>up('receiptHeightMm', e.target.value===''?'':Number(e.target.value))} onBlur={e=>up('receiptHeightMm',Math.max(0,Math.min(500,Number(e.target.value)||0)))} className={inputCls} dir="ltr"/>
          </Field>
          <Field label={ar?'حجم الخط (%)':'Font size (%)'}>
            <input type="number" min="50" max="200" value={d.receiptFontScale??100} onChange={e=>up('receiptFontScale', e.target.value===''?'':Number(e.target.value))} onBlur={e=>up('receiptFontScale',Math.max(50,Math.min(200,Number(e.target.value)||100)))} className={inputCls} dir="ltr"/>
          </Field>
          <Field label={ar?'حجم الشعار (بكسل)':'Logo size (px)'}>
            <input type="number" min="0" max="120" value={d.receiptLogoSize??40} onChange={e=>up('receiptLogoSize', e.target.value===''?'':Number(e.target.value))} onBlur={e=>up('receiptLogoSize',Math.max(0,Math.min(120,Number(e.target.value)||40)))} className={inputCls} dir="ltr"/>
          </Field>
          <Field label={ar?'حجم رمز QR (بكسل)':'QR code size (px)'}>
            <input type="number" min="0" max="220" value={d.receiptQrSize??105} onChange={e=>up('receiptQrSize', e.target.value===''?'':Number(e.target.value))} onBlur={e=>up('receiptQrSize',Math.max(0,Math.min(220,Number(e.target.value)||105)))} className={inputCls} dir="ltr"/>
          </Field>
        </div>
        <p className="text-[11px] mt-2" style={{color:'var(--muted)'}}>{ar?'مثال: طابعات ٥٧-٥٨ ملم شائعة جداً. لو الفاتورة تطلع صغيرة زوّد نسبة الخط، ولو الكلام يطلع خارج الورق قلّل العرض. طول الورق خلّه ٠ إلا لو تطبيق الطباعة عندك يطلب رقم طول محدد.':'e.g. 57–58mm printers are very common. If print looks too small, raise the font %. If text overflows, lower the width. Leave length at 0 unless your printing app requires a specific number.'}</p>
      </Collapsible>

      <Collapsible title={ar?'قوالب الرسائل الجاهزة (واتساب)':'Ready-made WhatsApp message templates'}>
        <p className="text-xs mb-4" style={{color:'var(--muted)'}}>
          {ar
            ? 'عدّل نص أي رسالة جاهزة زي ما تحب. المتغيرات بين قوسين تتحول تلقائي لقيمتها الفعلية عند الإرسال: {name} الاسم، {amount} مبلغ الكاش باك، {cur} العملة، {days} الأيام المتبقية، {offer} العرض اللي تكتبه بتبويب العملاء، {count} عدد طلبات الشهر، {threshold} العدد المطلوب (مثلاً 5)، {driver} اسم المندوب، {orderId} رقم الطلب، {customer} اسم العميل، {area} منطقة التوصيل، {time} الوقت اللي تكتبه وقت الإرسال.'
            : 'Edit any ready message however you like. Variables in braces are replaced automatically when sending: {name}, {amount} cashback amount, {cur} currency, {days} days left, {offer} the offer you type in the Customers tab, {count} orders this month, {threshold} the target (e.g. 5), {driver} driver name, {orderId} order number, {customer} customer name, {area} delivery area, {time} the time you type when sending.'}
        </p>
        <div className="space-y-4">
          <Field label={ar?'رسالة تذكير الكاش باك':'Cashback reminder message'}>
            <textarea className={inputCls+' resize-none'} rows="3" dir={ar?'rtl':'ltr'} value={d.msgCashback??''} onChange={e=>up('msgCashback',e.target.value)} placeholder={DEFAULT_MSG_TEMPLATES.msgCashback}/>
          </Field>
          <Field label={ar?'رسالة العميل المميز 🏅':'VIP customer message 🏅'}>
            <textarea className={inputCls+' resize-none'} rows="3" dir={ar?'rtl':'ltr'} value={d.msgVip??''} onChange={e=>up('msgVip',e.target.value)} placeholder={DEFAULT_MSG_TEMPLATES.msgVip}/>
          </Field>
          <Field label={ar?'رسالة "قارب يوصل 5 طلبات"':'"Almost reached 5 orders" message'}>
            <textarea className={inputCls+' resize-none'} rows="3" dir={ar?'rtl':'ltr'} value={d.msgNearThreshold??''} onChange={e=>up('msgNearThreshold',e.target.value)} placeholder={DEFAULT_MSG_TEMPLATES.msgNearThreshold}/>
          </Field>
          <Field label={ar?'الرسالة الجماعية الافتراضية (تظهر جاهزة بتبويب الرسالة الجماعية، وتقدر تعدلها كل مرة)':'Default broadcast message (pre-fills the Broadcast tab, editable each time)'}>
            <textarea className={inputCls+' resize-none'} rows="3" dir={ar?'rtl':'ltr'} value={d.msgBroadcastDefault??''} onChange={e=>up('msgBroadcastDefault',e.target.value)} placeholder={ar?'مثال: عرض اليوم! خصم 15% على كل الرولز 🍣':'e.g. Today only! 15% off all rolls 🍣'}/>
          </Field>
          <Field label={ar?'🛵 رسالة "جهّزه" للمندوب':'🛵 Driver "get ready" message'}>
            <textarea className={inputCls+' resize-none'} rows="3" dir={ar?'rtl':'ltr'} value={d.msgDriverReady??''} onChange={e=>up('msgDriverReady',e.target.value)} placeholder={DEFAULT_MSG_TEMPLATES.msgDriverReady}/>
          </Field>
          <Field label={ar?'⏰ رسالة "متأخر" للمندوب':'⏰ Driver "late" message'}>
            <textarea className={inputCls+' resize-none'} rows="3" dir={ar?'rtl':'ltr'} value={d.msgDriverLate??''} onChange={e=>up('msgDriverLate',e.target.value)} placeholder={DEFAULT_MSG_TEMPLATES.msgDriverLate}/>
          </Field>
        </div>
      </Collapsible>

      <div className="sticky bottom-4 flex justify-end"><button onClick={save} className="px-8 py-3 rounded-xl text-white font-head shadow-soft" style={{background:done?'#25D366':'var(--red)'}}>{done?t('saved'):t('save')}</button></div>
    </div>
  );
}
function AdminAccount({t}){
  const [u,setU]=useState(''); const [p,setP]=useState(''); const [done,setDone]=useState(false); const [err,setErr]=useState('');
  const save=async()=>{ if(!u.trim()||!p) return; setErr('');
    try{ await apiPost('admin_account.php',{username:u.trim(),password:p}); setDone(true); setTimeout(()=>setDone(false),1800); }
    catch(e){ setErr(e.message); } };
  return (
    <div className="max-w-md">
      <Card title={t('changePass')}><div className="space-y-3"><Field label={t('newUser')}><input className={inputCls} dir="ltr" value={u} onChange={e=>setU(e.target.value)}/></Field><Field label={t('newPass')}><input className={inputCls} dir="ltr" value={p} onChange={e=>setP(e.target.value)}/></Field>{err&&<p className="text-sm" style={{color:'var(--red)'}}>{err}</p>}<button onClick={save} className="w-full py-3 rounded-xl text-white font-head" style={{background:done?'#25D366':'var(--red)'}}>{done?t('saved'):t('save')}</button></div></Card>
      <p className="text-xs mt-3" style={{color:'var(--muted)'}}>{t('username')==='Username'?'Only one admin account. Everyone else uses the site as a customer.':'يوجد حساب أدمن واحد فقط. بقية الزوار يستخدمون الموقع مباشرة كزبائن.'}</p>
    </div>
  );
}
function Card({title,children}){ return <div className="bg-white rounded-3xl p-6 shadow-card border hairline"><h4 className="font-head text-lg mb-4" style={{color:'var(--red)'}}>{title}</h4>{children}</div>; }
function Collapsible({title,icon,defaultOpen,children}){
  const [open,setOpen]=useState(!!defaultOpen);
  return (
    <div className="bg-white rounded-3xl shadow-card border hairline overflow-hidden">
      <button type="button" onClick={()=>setOpen(v=>!v)} className="w-full flex items-center justify-between gap-3 p-5 text-start">
        <span className="font-head text-lg flex items-center gap-2" style={{color:'var(--red)'}}>{icon}{title}</span>
        <Ic.chevron width="18" height="18" className="shrink-0 transition-transform" style={{color:'var(--muted)',transform:open?'rotate(180deg)':'none'}}/>
      </button>
      {open&&<div className="px-6 pb-6 -mt-1">{children}</div>}
    </div>
  );
}
function Modal({title,children,onClose,onSave,t}){
  useEffect(()=>{ document.body.classList.add('noscroll'); return ()=>document.body.classList.remove('noscroll'); },[]);
  return (
    <div className="fixed inset-0 z-50 grid place-items-center p-4" onClick={onClose}>
      <div className="absolute inset-0 bg-black/50 backdrop-blur-sm"/>
      <div onClick={e=>e.stopPropagation()} className="relative bg-white rounded-3xl w-full max-w-lg max-h-[90vh] overflow-auto shadow-soft">
        <div className="sticky top-0 bg-white flex items-center justify-between p-5 border-b hairline z-10"><h3 className="font-head text-xl" style={{color:'var(--ink)'}}>{title}</h3><button onClick={onClose} className="w-9 h-9 grid place-items-center rounded-xl hover:bg-paper-deep"><Ic.x width="18" height="18"/></button></div>
        <div className="p-5 space-y-4">{children}</div>
        <div className="sticky bottom-0 bg-white flex gap-3 p-5 border-t hairline"><button onClick={onClose} className="flex-1 py-2.5 rounded-xl border-2 hairline font-head">{t('cancel')}</button><button onClick={onSave} className="flex-1 py-2.5 rounded-xl text-white font-head" style={{background:'var(--red)'}}>{t('save')}</button></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
