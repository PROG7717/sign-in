<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة التحكم — Admin</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #8b5cf6; --secondary: #22d3ee; --accent: #fb7185;
    --bg: #06070c; --surface: #0d0f18; --fg: #f3f4f8; --muted: #9aa1b8;
    --line: rgba(255,255,255,.08); --ok: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); line-height: 1.6; min-height: 100svh;
    font-family: "IBM Plex Sans Arabic", "Space Grotesk", system-ui, sans-serif;
  }
  html[lang="en"] body { font-family: "Space Grotesk", "IBM Plex Sans Arabic", system-ui, sans-serif; }
  ::selection { background: var(--primary); color: #fff; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }
  .hidden { display: none !important; }

  .glass { background: rgba(255,255,255,.04); border: 1px solid var(--line); backdrop-filter: blur(16px); }
  .text-gradient {
    background: linear-gradient(92deg, var(--primary), var(--secondary) 60%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .btn {
    display: inline-block; padding: 12px 26px; border-radius: 999px; font-weight: 600; border: none; color: #fff;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    box-shadow: 0 0 34px -10px var(--primary); transition: transform .2s;
  }
  .btn:hover { transform: scale(1.04); }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .btn-ghost { background: rgba(255,255,255,.04); border: 1px solid var(--line); box-shadow: none; color: var(--fg); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger { background: none; box-shadow: none; border: 1px solid color-mix(in oklab, var(--accent) 45%, transparent); color: var(--accent); }
  .btn-danger:hover { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .btn-sm { padding: 8px 16px; font-size: .85rem; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); outline: none; font: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
  .msg { margin-top: 10px; font-size: .9rem; font-weight: 500; display: none; }
  .msg.ok { color: var(--ok); display: block; }
  .msg.err { color: var(--accent); display: block; }

  /* ---- login ---- */
  #login-view { min-height: 100svh; display: grid; place-items: center; padding: 20px; }
  .login-card { width: 100%; max-width: 420px; border-radius: 24px; padding: 36px; }
  .brand-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(45deg, var(--primary), var(--secondary)); box-shadow: 0 0 22px var(--primary); margin-bottom: 18px; }
  .login-card h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .login-card .sub { color: var(--muted); margin-bottom: 24px; font-size: .95rem; }

  /* ---- shell ---- */
  #app-view { display: none; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(6,7,12,.8); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1150px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .topbar .who { font-size: .8rem; color: var(--muted); direction: ltr; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    padding: 9px 18px; border-radius: 999px; font-size: .9rem; font-weight: 600;
    background: none; border: 1px solid transparent; color: var(--muted);
  }
  .tab:hover { color: var(--fg); }
  .tab.active { background: color-mix(in oklab, var(--primary) 16%, transparent); border-color: color-mix(in oklab, var(--primary) 45%, transparent); color: var(--fg); }
  main { max-width: 1150px; margin: 0 auto; padding: 34px 20px 90px; }
  h2 { font-size: 1.7rem; margin-bottom: 4px; }
  .page-sub { color: var(--muted); margin-bottom: 26px; font-size: .95rem; }

  /* ---- overview ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .stat-card { border-radius: 18px; padding: 20px; }
  .stat-card b { font-size: 2rem; }
  .stat-card span { display: block; color: var(--muted); font-size: .85rem; }

  /* ---- lists ---- */
  .row {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-radius: 16px; padding: 14px; margin-bottom: 10px;
  }
  .thumb { width: 76px; height: 54px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: var(--surface); flex: none; }
  .row .grow { flex: 1; min-width: 180px; }
  .row .grow b { display: block; }
  .row .grow small { color: var(--muted); direction: ltr; unicode-bidi: plaintext; }
  .pill { padding: 5px 12px; border-radius: 999px; font-size: .75rem; font-weight: 700; border: 1px solid; background: none; }
  .pill.on-primary { color: var(--primary); border-color: color-mix(in oklab, var(--primary) 50%, transparent); background: color-mix(in oklab, var(--primary) 12%, transparent); }
  .pill.on-ok { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 50%, transparent); background: color-mix(in oklab, var(--ok) 10%, transparent); }
  .pill.on-warn { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
  .pill.off { color: var(--muted); border-color: var(--line); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .stars { color: var(--accent); letter-spacing: 2px; }
  .stars .off { color: rgba(255,255,255,.18); }
  .review-comment { color: rgba(243,244,248,.85); font-size: .95rem; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px; border-radius: 18px; }

  /* ---- project form ---- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  @media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid .span2 { grid-column: 1 / -1; }
  .card-section { border-radius: 20px; padding: 24px; margin-bottom: 18px; }
  .card-section h3 { margin-bottom: 16px; font-size: 1.05rem; }
  .upload-btn { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 20px; background: none; color: var(--fg); font-size: .9rem; }
  .upload-btn:hover { border-color: var(--primary); color: var(--primary); }
  .gallery-thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .g-item { position: relative; }
  .g-item img { width: 110px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .g-item button {
    position: absolute; top: 5px; inset-inline-end: 5px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(6,7,12,.8); border: 1px solid var(--line); color: var(--accent); font-size: 11px; line-height: 1;
  }
  .check-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--primary); }

  /* ---- theme tab ---- */
  .color-row { display: flex; align-items: center; gap: 12px; }
  .color-row input[type="color"] { width: 52px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: none; padding: 2px; cursor: pointer; }
  .preview-strip { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border-radius: 14px; border: 1px solid var(--line); padding: 18px; margin-top: 6px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    .topbar-inner { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; }
    .tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; padding: 8px 14px; font-size: .85rem; flex: none; }
    .topbar .who { display: none; }
    main { padding: 22px 14px 70px; }
    h2 { font-size: 1.4rem; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .stat-card b { font-size: 1.5rem; }
    .row { padding: 12px; }
    .row .actions { width: 100%; }
    .actions .btn { flex: 1; text-align: center; }
    .card-section { padding: 16px; }
    .login-card { padding: 26px; }
    .g-item img { width: 92px; height: 66px; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view">
  <div class="login-card glass">
    <span class="brand-dot"></span>
    <h1 data-i18n="login_title"></h1>
    <p class="sub" data-i18n="login_sub"></p>
    <form id="login-form">
      <div class="field"><label data-i18n="email"></label><input type="email" name="email" required autocomplete="email" dir="ltr" /></div>
      <div class="field"><label data-i18n="password"></label><input type="password" name="password" required autocomplete="current-password" dir="ltr" /></div>
      <button type="submit" class="btn" style="width:100%" id="login-btn" data-i18n="login_btn"></button>
      <p class="msg" id="login-msg"></p>
    </form>
    <p style="margin-top:18px;display:flex;justify-content:space-between;align-items:center">
      <a href="index.html" style="color:var(--muted);font-size:.85rem" data-i18n="back_site"></a>
      <button class="btn-ghost btn btn-sm" id="lang-toggle-login">EN</button>
    </p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-view">
  <div class="topbar">
    <div class="topbar-inner">
      <nav class="tabs">
        <button class="tab active" data-tab="overview" data-i18n="tab_overview"></button>
        <button class="tab" data-tab="projects" data-i18n="tab_projects"></button>
        <button class="tab" data-tab="reviews" data-i18n="tab_reviews"></button>
        <button class="tab" data-tab="theme" data-i18n="tab_theme"></button>
      </nav>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="who" id="who"></span>
        <a href="index.html" class="btn btn-ghost btn-sm" data-i18n="view_site"></a>
        <button class="btn btn-ghost btn-sm" id="lang-toggle">EN</button>
        <button class="btn btn-danger btn-sm" id="signout" data-i18n="signout"></button>
      </div>
    </div>
  </div>

  <main>
    <!-- Overview -->
    <section id="tab-overview">
      <h2 data-i18n="overview_title"></h2>
      <p class="page-sub" data-i18n="overview_sub"></p>
      <div class="stat-grid" id="stat-grid"></div>
      <div class="card-section glass">
        <h3 data-i18n="latest_reviews"></h3>
        <div id="overview-reviews"></div>
      </div>
    </section>

    <!-- Projects -->
    <section id="tab-projects" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px">
        <div><h2 data-i18n="projects_title"></h2><p class="page-sub" style="margin:0" data-i18n="projects_sub"></p></div>
        <button class="btn" id="new-project" data-i18n="new_project"></button>
      </div>
      <div id="projects-list"></div>

      <!-- Project form -->
      <div id="project-form-wrap" class="hidden">
        <h2 id="form-title" style="margin-bottom:18px"></h2>
        <form id="project-form">
          <div class="card-section glass form-grid">
            <div class="field"><label data-i18n="f_title_en"></label><input name="title_en" required dir="ltr" /></div>
            <div class="field"><label data-i18n="f_title_ar"></label><input name="title_ar" dir="rtl" /></div>
            <div class="field span2"><label data-i18n="f_slug"></label><input name="slug" required dir="ltr" style="font-family:monospace" /></div>
            <div class="field"><label data-i18n="f_tagline_en"></label><input name="tagline_en" dir="ltr" /></div>
            <div class="field"><label data-i18n="f_tagline_ar"></label><input name="tagline_ar" dir="rtl" /></div>
            <div class="field"><label data-i18n="f_desc_en"></label><textarea name="description_en" rows="6" dir="ltr"></textarea></div>
            <div class="field"><label data-i18n="f_desc_ar"></label><textarea name="description_ar" rows="6" dir="rtl"></textarea></div>
            <div class="field"><label data-i18n="f_category"></label>
              <select name="category">
                <option value="web">Web</option><option value="mobile">Mobile</option><option value="branding">Branding</option>
              </select>
            </div>
            <div class="field"><label data-i18n="f_year"></label><input name="year" type="number" min="2000" max="2100" dir="ltr" /></div>
            <div class="field span2"><label data-i18n="f_tags"></label><input name="tags" dir="ltr" placeholder="Three.js, Next.js, WebGL" /></div>
            <div class="field span2"><label data-i18n="f_live"></label><input name="live_url" type="url" dir="ltr" placeholder="https://…" /></div>
          </div>

          <div class="card-section glass">
            <h3 data-i18n="f_cover"></h3>
            <div class="gallery-thumbs" id="cover-preview"></div>
            <button type="button" class="upload-btn" id="cover-btn"><span data-i18n="upload"></span></button>
            <input type="file" id="cover-input" accept="image/*" class="hidden" />
          </div>

          <div class="card-section glass">
            <h3 data-i18n="f_gallery"></h3>
            <div class="gallery-thumbs" id="gallery-preview"></div>
            <button type="button" class="upload-btn" id="gallery-btn"><span data-i18n="upload"></span></button>
            <input type="file" id="gallery-input" accept="image/*" multiple class="hidden" />
          </div>

          <div class="card-section glass">
            <label class="check-row"><input type="checkbox" name="featured" /><span data-i18n="f_featured"></span></label>
            <label class="check-row"><input type="checkbox" name="published" checked /><span data-i18n="f_published"></span></label>
          </div>

          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button type="submit" class="btn" id="save-project" data-i18n="save"></button>
            <button type="button" class="btn btn-ghost" id="cancel-form" data-i18n="cancel"></button>
            <p class="msg" id="form-msg" style="margin:0"></p>
          </div>
        </form>
      </div>
    </section>

    <!-- Reviews -->
    <section id="tab-reviews" class="hidden">
      <h2 data-i18n="reviews_title"></h2>
      <p class="page-sub" data-i18n="reviews_sub"></p>
      <div class="tabs" id="review-filters" style="margin-bottom:20px"></div>
      <div id="reviews-list"></div>
    </section>

    <!-- Theme -->
    <section id="tab-theme" class="hidden">
      <h2 data-i18n="theme_title"></h2>
      <p class="page-sub" data-i18n="theme_sub"></p>
      <form id="theme-form">
        <div class="card-section glass">
          <h3 data-i18n="colors"></h3>
          <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
            <div class="field"><label data-i18n="c_primary"></label>
              <div class="color-row"><input type="color" id="c-primary" /><input id="c-primary-hex" dir="ltr" style="font-family:monospace" /></div>
            </div>
            <div class="field"><label data-i18n="c_secondary"></label>
              <div class="color-row"><input type="color" id="c-secondary" /><input id="c-secondary-hex" dir="ltr" style="font-family:monospace" /></div>
            </div>
            <div class="field"><label data-i18n="c_accent"></label>
              <div class="color-row"><input type="color" id="c-accent" /><input id="c-accent-hex" dir="ltr" style="font-family:monospace" /></div>
            </div>
          </div>
          <div class="preview-strip">
            <span class="btn" style="pointer-events:none" data-i18n="preview_btn"></span>
            <span class="pill on-warn" data-i18n="c_accent"></span>
            <b class="text-gradient" style="font-size:1.4rem">Gradient ✦</b>
          </div>
          <p class="page-sub" style="margin:12px 0 0" data-i18n="preview_hint"></p>
        </div>
        <div class="card-section glass form-grid">
          <div class="field"><label data-i18n="name_en"></label><input id="s-name-en" dir="ltr" /></div>
          <div class="field"><label data-i18n="name_ar"></label><input id="s-name-ar" dir="rtl" /></div>
        </div>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <button type="submit" class="btn" data-i18n="save_publish"></button>
          <button type="button" class="btn btn-ghost" id="theme-reset" data-i18n="reset"></button>
          <p class="msg" id="theme-msg" style="margin:0"></p>
        </div>
      </form>
    </section>
  </main>
</div>

let locale = localStorage.getItem("admin_locale") || ((navigator.language || "ar").startsWith("ar") ? "ar" : "en");
const t = (k) => T[locale][k] ?? k;
function applyI18n() {
  document.documentElement.lang = locale;
  document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  document.querySelectorAll("#lang-toggle,#lang-toggle-login").forEach((b) => (b.textContent = locale === "ar" ? "EN" : "عربي"));
}
function toggleLocale() {
  locale = locale === "ar" ? "en" : "ar";
  localStorage.setItem("admin_locale", locale);
  applyI18n(); renderAll();
}
document.getElementById("lang-toggle").onclick = toggleLocale;
document.getElementById("lang-toggle-login").onclick = () => { toggleLocale(); };

/* ---------------- helpers ---------------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const asset = (u) => (u && u.startsWith("/") ? "public" + u : u);
const stars = (n) => `<span class="stars">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;
const loc = (row, key) => (locale === "ar" && row[key + "_ar"]?.trim() ? row[key + "_ar"] : row[key + "_en"]) ?? "";
const slugify = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const okColor = (v) => /^#[0-9a-fA-F]{6}$/.test(v);

/* ---------------- auth ---------------- */
let session = JSON.parse(localStorage.getItem("portfolio_admin_session") || "null");

async function authFetch(grant, body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
    method: "POST",
    headers: { apikey: ANON, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("auth " + res.status);
  return res.json();
}

function saveSession(data) {
  session = data ? { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user } : null;
  if (session) localStorage.setItem("portfolio_admin_session", JSON.stringify(session));
  else localStorage.removeItem("portfolio_admin_session");
}

async function api(path, { method = "GET", body, headers = {}, retry = true } = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: ANON,
      Authorization: `Bearer ${session?.access_token ?? ANON}`,
      "Content-Type": "application/json",
      Prefer: method === "GET" ? "" : "return=representation",
      ...headers,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && session && retry) {
    // access token expired → refresh once
    try {
      saveSession(await authFetch("refresh_token", { refresh_token: session.refresh_token }));
      return api(path, { method, body, headers, retry: false });
    } catch { logout(); throw new Error("session expired"); }
  }
  if (!res.ok) throw new Error(`${method} ${path} → ${res.status}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function isAdmin() {
  const rows = await api(`portfolio_admins?select=user_id&user_id=eq.${session.user.id}`);
  return rows.length > 0;
}

function logout() {
  saveSession(null);
  document.getElementById("app-view").style.display = "none";
  document.getElementById("login-view").style.display = "grid";
}
document.getElementById("signout").onclick = logout;

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  const msg = document.getElementById("login-msg");
  msg.className = "msg"; btn.disabled = true;
  const data = Object.fromEntries(new FormData(e.target));
  try {
    saveSession(await authFetch("password", { email: data.email.trim(), password: data.password }));
    if (!(await isAdmin())) { logout(); msg.textContent = t("err_not_admin"); msg.className = "msg err"; }
    else await enterApp();
  } catch {
    msg.textContent = t("err_invalid"); msg.className = "msg err";
  }
  btn.disabled = false;
});

/* ---------------- state + load ---------------- */
let projects = [], reviews = [], settings = null;
let reviewFilter = "pending", editingId = null, coverUrl = "", gallery = [];

async function loadAll() {
  [projects, reviews, settings] = await Promise.all([
    api("portfolio_projects?select=*&order=sort_order.asc,created_at.desc"),
    api("portfolio_reviews?select=*&order=created_at.desc"),
    api("portfolio_settings?id=eq.1").then((r) => r[0] ?? null),
  ]);
}

async function enterApp() {
  document.getElementById("login-view").style.display = "none";
  document.getElementById("app-view").style.display = "block";
  document.getElementById("who").textContent = session.user.email;
  await loadAll();
  applyThemePreview(settings?.primary_color, settings?.secondary_color, settings?.accent_color);
  fillThemeForm(); renderAll();
}

/* ---------------- tabs ---------------- */
document.querySelectorAll(".tab[data-tab]").forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll(".tab[data-tab]").forEach((x) => x.classList.toggle("active", x === tab));
    ["overview", "projects", "reviews", "theme"].forEach((name) =>
      document.getElementById("tab-" + name).classList.toggle("hidden", name !== tab.dataset.tab));
    closeForm();
  };
});

/* ---------------- overview ---------------- */
function renderOverview() {
  const approved = reviews.filter((r) => r.status === "approved");
  const avg = approved.length ? (approved.reduce((s, r) => s + r.rating, 0) / approved.length).toFixed(1) + "★" : "—";
  const pending = reviews.filter((r) => r.status === "pending").length;
  const cells = [
    [projects.length, t("st_projects")],
    [projects.filter((p) => p.published).length, t("st_published")],
    [pending, t("st_pending")],
    [avg, t("st_avg")],
  ];
  document.getElementById("stat-grid").innerHTML = cells.map(([v, l]) =>
    `<div class="stat-card glass"><b class="text-gradient">${v}</b><span>${l}</span></div>`).join("");
  document.getElementById("overview-reviews").innerHTML = reviews.slice(0, 5).map((r) => `
    <div class="row" style="border-bottom:1px solid var(--line);border-radius:0;margin:0">
      <div class="grow"><b>${esc(r.author_name)} ${statusPill(r.status)}</b>
      <span class="review-comment" dir="auto">${esc(r.comment.slice(0, 120))}${r.comment.length > 120 ? "…" : ""}</span></div>
      ${stars(r.rating)}
    </div>`).join("") || `<p class="empty">${t("empty")}</p>`;
}

/* ---------------- projects ---------------- */
function renderProjects() {
  const list = document.getElementById("projects-list");
  if (!projects.length) { list.innerHTML = `<p class="empty glass">${t("empty")}</p>`; return; }
  list.innerHTML = projects.map((p) => `
    <div class="row glass" data-id="${p.id}">
      <img class="thumb" src="${esc(asset(p.cover_url) || "")}" alt="" onerror="this.style.visibility='hidden'" />
      <div class="grow"><b>${esc(loc(p, "title"))}</b><small>/${esc(p.slug)} · ${esc(p.category)}${p.year ? " · " + p.year : ""}</small></div>
      <button class="pill ${p.featured ? "on-primary" : "off"}" data-act="featured">★ ${t("featured")}</button>
      <button class="pill ${p.published ? "on-ok" : "on-warn"}" data-act="published">${p.published ? t("published") : t("draft")}</button>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" data-act="edit">${t("edit")}</button>
        <button class="btn btn-danger btn-sm" data-act="del">${t("del")}</button>
      </div>
    </div>`).join("");

  list.querySelectorAll("[data-act]").forEach((btn) => {
    btn.onclick = async () => {
      const row = btn.closest("[data-id]");
      const project = projects.find((p) => p.id === row.dataset.id);
      const act = btn.dataset.act;
      try {
        if (act === "featured" || act === "published") {
          await api(`portfolio_projects?id=eq.${project.id}`, { method: "PATCH", body: { [act]: !project[act] } });
          project[act] = !project[act]; renderProjects();
        } else if (act === "edit") {
          openForm(project);
        } else if (act === "del") {
          if (!confirm(t("confirm_del_project"))) return;
          await api(`portfolio_projects?id=eq.${project.id}`, { method: "DELETE" });
          projects = projects.filter((p) => p.id !== project.id);
          renderProjects(); renderOverview();
        }
      } catch { alert(t("err_generic")); }
    };
  });
}

/* ---- project form ---- */
const form = document.getElementById("project-form");
let slugTouched = false;

function openForm(project) {
  editingId = project?.id ?? null;
  slugTouched = Boolean(project);
  coverUrl = project?.cover_url ?? "";
  gallery = [...(project?.gallery ?? [])];
  document.getElementById("form-title").textContent = project ? t("form_edit") : t("form_new");
  form.reset();
  if (project) {
    for (const key of ["title_en","title_ar","slug","tagline_en","tagline_ar","description_en","description_ar","category","live_url"])
      form.elements[key].value = project[key] ?? "";
    form.elements.year.value = project.year ?? "";
    form.elements.tags.value = (project.tags ?? []).join(", ");
    form.elements.featured.checked = project.featured;
    form.elements.published.checked = project.published;
  } else {
    form.elements.published.checked = true;
  }
  renderUploads();
  document.getElementById("projects-list").classList.add("hidden");
  document.getElementById("new-project").classList.add("hidden");
  document.getElementById("project-form-wrap").classList.remove("hidden");
}
function closeForm() {
  document.getElementById("project-form-wrap").classList.add("hidden");
  document.getElementById("projects-list").classList.remove("hidden");
  document.getElementById("new-project").classList.remove("hidden");
  document.getElementById("form-msg").className = "msg";
}
document.getElementById("new-project").onclick = () => openForm(null);
document.getElementById("cancel-form").onclick = closeForm;
form.elements.title_en.addEventListener("input", (e) => {
  if (!slugTouched) form.elements.slug.value = slugify(e.target.value);
});
form.elements.slug.addEventListener("input", () => (slugTouched = true));

function renderUploads() {
  document.getElementById("cover-preview").innerHTML = coverUrl
    ? `<div class="g-item"><img src="${esc(asset(coverUrl))}" /><button type="button" id="rm-cover">✕</button></div>` : "";
  const rm = document.getElementById("rm-cover");
  if (rm) rm.onclick = () => { coverUrl = ""; renderUploads(); };
  document.getElementById("gallery-preview").innerHTML = gallery.map((g, i) =>
    `<div class="g-item"><img src="${esc(asset(g))}" /><button type="button" data-rm="${i}">✕</button></div>`).join("");
  document.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { gallery.splice(+b.dataset.rm, 1); renderUploads(); }));
}

async function upload(file) {
  const safe = file.name.toLowerCase().replace(/[^a-z0-9.]+/g, "-");
  const path = `projects/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safe}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/portfolio/${path}`, {
    method: "POST",
    headers: { apikey: ANON, Authorization: `Bearer ${session.access_token}`, "Content-Type": file.type || "application/octet-stream", "cache-control": "31536000" },
    body: file,
  });
  if (!res.ok) throw new Error("upload " + res.status);
  return `${SUPABASE_URL}/storage/v1/object/public/portfolio/${path}`;
}

function wireUpload(btnId, inputId, onDone) {
  const btn = document.getElementById(btnId), input = document.getElementById(inputId);
  btn.onclick = () => input.click();
  input.onchange = async () => {
    const files = [...input.files]; if (!files.length) return;
    btn.disabled = true; btn.firstElementChild.textContent = t("uploading");
    try { for (const f of files) onDone(await upload(f)); renderUploads(); }
    catch { alert(t("err_generic")); }
    btn.disabled = false; btn.firstElementChild.textContent = t("upload");
    input.value = "";
  };
}
wireUpload("cover-btn", "cover-input", (url) => (coverUrl = url));
wireUpload("gallery-btn", "gallery-input", (url) => gallery.push(url));

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("form-msg");
  const btn = document.getElementById("save-project");
  msg.className = "msg"; btn.disabled = true;
  const d = Object.fromEntries(new FormData(form));
  const payload = {
    title_en: d.title_en.trim(), title_ar: d.title_ar.trim(),
    slug: slugify(d.slug || d.title_en),
    tagline_en: d.tagline_en.trim(), tagline_ar: d.tagline_ar.trim(),
    description_en: d.description_en.trim(), description_ar: d.description_ar.trim(),
    category: d.category, year: d.year ? Number(d.year) : null,
    tags: d.tags.split(",").map((x) => x.trim()).filter(Boolean),
    live_url: d.live_url.trim() || null,
    cover_url: coverUrl || null, gallery,
    featured: form.elements.featured.checked, published: form.elements.published.checked,
  };
  try {
    if (editingId) await api(`portfolio_projects?id=eq.${editingId}`, { method: "PATCH", body: payload });
    else await api("portfolio_projects", { method: "POST", body: payload });
    await loadAll(); renderAll(); closeForm();
  } catch { msg.textContent = t("err_save"); msg.className = "msg err"; }
  btn.disabled = false;
});

/* ---------------- reviews ---------------- */
function statusPill(status) {
  const cls = status === "approved" ? "on-ok" : status === "pending" ? "on-warn" : "off";
  const label = { approved: t("rt_approved"), pending: t("rt_pending"), hidden: t("rt_hidden") }[status];
  return `<span class="pill ${cls}" style="font-size:.68rem">${label}</span>`;
}

function renderReviews() {
  const filters = document.getElementById("review-filters");
  const counts = { pending: 0, approved: 0, hidden: 0, all: reviews.length };
  reviews.forEach((r) => counts[r.status]++);
  filters.innerHTML = ["pending", "approved", "hidden", "all"].map((f) =>
    `<button class="tab ${reviewFilter === f ? "active" : ""}" data-f="${f}">${t("rt_" + f)} (${counts[f]})</button>`).join("");
  filters.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { reviewFilter = b.dataset.f; renderReviews(); }));

  const visible = reviewFilter === "all" ? reviews : reviews.filter((r) => r.status === reviewFilter);
  const list = document.getElementById("reviews-list");
  if (!visible.length) { list.innerHTML = `<p class="empty glass">${t("empty")}</p>`; return; }
  list.innerHTML = visible.map((r) => {
    const project = projects.find((p) => p.id === r.project_id);
    return `
    <div class="row glass" data-id="${r.id}" style="align-items:flex-start">
      <div class="grow">
        <b>${esc(r.author_name)} ${r.author_role ? `<small style="font-weight:400">— ${esc(r.author_role)}</small>` : ""} ${statusPill(r.status)}</b>
        <div>${stars(r.rating)} <span class="pill off" style="font-size:.68rem">${project ? t("on_project") + ": " + esc(loc(project, "title")) : t("general")}</span></div>
        <p class="review-comment" dir="auto">${esc(r.comment)}</p>
      </div>
      <div class="actions">
        ${r.status !== "approved" ? `<button class="btn btn-sm" data-act="approved">${t("approve")}</button>` : ""}
        ${r.status !== "hidden" ? `<button class="btn btn-ghost btn-sm" data-act="hidden">${t("hide")}</button>` : ""}
        <button class="btn btn-danger btn-sm" data-act="del">${t("del")}</button>
      </div>
    </div>`;
  }).join("");

  list.querySelectorAll("[data-act]").forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.closest("[data-id]").dataset.id;
      const review = reviews.find((r) => r.id === id);
      try {
        if (btn.dataset.act === "del") {
          if (!confirm(t("confirm_del_review"))) return;
          await api(`portfolio_reviews?id=eq.${id}`, { method: "DELETE" });
          reviews = reviews.filter((r) => r.id !== id);
        } else {
          await api(`portfolio_reviews?id=eq.${id}`, { method: "PATCH", body: { status: btn.dataset.act } });
          review.status = btn.dataset.act;
        }
        renderReviews(); renderOverview();
      } catch { alert(t("err_generic")); }
    };
  });
}

/* ---------------- theme ---------------- */
function applyThemePreview(primary, secondary, accent) {
  const root = document.documentElement.style;
  if (okColor(primary)) root.setProperty("--primary", primary);
  if (okColor(secondary)) root.setProperty("--secondary", secondary);
  if (okColor(accent)) root.setProperty("--accent", accent);
}

const themeFields = [
  ["c-primary", "primary_color"],
  ["c-secondary", "secondary_color"],
  ["c-accent", "accent_color"],
];

function fillThemeForm() {
  themeFields.forEach(([id, key]) => {
    const v = settings?.[key] ?? DEFAULTS[key.replace("_color", "")];
    document.getElementById(id).value = v;
    document.getElementById(id + "-hex").value = v;
  });
  document.getElementById("s-name-en").value = settings?.site_name_en ?? "";
  document.getElementById("s-name-ar").value = settings?.site_name_ar ?? "";
}

themeFields.forEach(([id]) => {
  const picker = document.getElementById(id), hex = document.getElementById(id + "-hex");
  const sync = (v) => {
    picker.value = okColor(v) ? v : picker.value; hex.value = v;
    applyThemePreview(
      document.getElementById("c-primary").value,
      document.getElementById("c-secondary").value,
      document.getElementById("c-accent").value,
    );
  };
  picker.oninput = () => sync(picker.value);
  hex.oninput = () => sync(hex.value.trim());
});

document.getElementById("theme-reset").onclick = () => {
  themeFields.forEach(([id, key]) => {
    const v = DEFAULTS[key.replace("_color", "")];
    document.getElementById(id).value = v; document.getElementById(id + "-hex").value = v;
  });
  applyThemePreview(DEFAULTS.primary, DEFAULTS.secondary, DEFAULTS.accent);
};

document.getElementById("theme-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("theme-msg");
  msg.className = "msg";
  const body = {
    primary_color: document.getElementById("c-primary-hex").value.trim(),
    secondary_color: document.getElementById("c-secondary-hex").value.trim(),
    accent_color: document.getElementById("c-accent-hex").value.trim(),
    site_name_en: document.getElementById("s-name-en").value.trim() || "NOVA Studio",
    site_name_ar: document.getElementById("s-name-ar").value.trim() || "استوديو نوفا",
  };
  for (const key of ["primary_color", "secondary_color", "accent_color"])
    if (!okColor(body[key])) { msg.textContent = t("err_generic"); msg.className = "msg err"; return; }
  try {
    const rows = await api("portfolio_settings?id=eq.1", { method: "PATCH", body });
    if (!rows?.length) throw new Error("no rows updated");
    settings = rows[0];
    msg.textContent = t("theme_saved"); msg.className = "msg ok";
  } catch { msg.textContent = t("err_generic"); msg.className = "msg err"; }
});

/* ---------------- boot ---------------- */
function renderAll() { renderOverview(); renderProjects(); renderReviews(); }
applyI18n();
if (session) {
  isAdmin().then((ok) => (ok ? enterApp() : logout())).catch(logout);
}
</script>
